<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta content="{{ page.desc | default: site.description }}" name="description">
  <meta name="keywords" content="{{ site.keywords }}">
  <meta name="author" content="{{ site.author.name }}">

  <title>
    {%- if page.title and page.title != "index" -%}
      {{ site.title }} | {{ page.title }}
    {%- else -%}
      {{ site.title }} — VCR-style HTTP record/replay
    {%- endif -%}
  </title>

  <link rel="shortcut icon" href="{{ '/static/assets/img/favicon.png' | prepend: site.baseurl }}">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Tailwind-built stylesheet -->
  <link href="{{ '/static/css/app.css' | prepend: site.baseurl }}" rel="stylesheet">

  <!-- Dark mode: apply before paint to avoid a flash. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var system = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (!stored && system)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>
</head>
