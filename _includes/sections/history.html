<div class="section">
  <div class="mx-auto max-w-3xl text-center">
    <p class="eyebrow">History</p>
    <h2 class="mt-3 text-3xl font-bold tracking-tight text-slate-900 dark:text-white md:text-4xl">
      Service Virtualization history
    </h2>
  </div>

  <ol class="relative mx-auto mt-12 max-w-2xl border-l-2 border-slate-200 dark:border-slate-700">
    {% for event in site.data.index.history %}
    <li class="mb-10 ml-6">
      <span class="absolute -left-[11px] flex h-5 w-5 items-center justify-center rounded-full ring-4 ring-white dark:ring-slate-950 {% if event.present %}bg-brand-500{% else %}bg-slate-300 dark:bg-slate-600{% endif %}"></span>
      <div class="card">
        <div class="flex flex-wrap items-baseline justify-between gap-2">
          <h3 class="font-semibold text-slate-900 dark:text-white">{{ event.name.detail }}</h3>
          <span class="font-mono text-xs text-brand-600 dark:text-brand-400">{{ event.date.detail }}</span>
        </div>
        <p class="mt-2 text-sm text-slate-600 dark:text-slate-400">{{ event.desc.detail }}</p>
        <p class="mt-2 text-xs uppercase tracking-wide text-slate-400 dark:text-slate-500">{{ event.job.detail }}</p>
      </div>
    </li>
    {% endfor %}
  </ol>
</div>
