<header class="fixed inset-x-0 top-0 z-50 border-b border-slate-200/70 bg-white/80 backdrop-blur dark:border-slate-800/70 dark:bg-slate-950/80">
  <nav class="mx-auto flex max-w-6xl items-center justify-between px-6 py-3">
    <a href="#page-top" class="flex items-center gap-2 font-extrabold tracking-tight text-slate-900 dark:text-white">
      <span class="grid h-7 w-7 place-items-center rounded-md bg-brand-500 font-mono text-sm text-white">Sv</span>
      Servirtium
    </a>

    <div class="hidden items-center gap-6 md:flex">
      {% for section in site.data.landing %}
        <a class="text-sm font-medium text-slate-600 transition hover:text-brand-600 dark:text-slate-300 dark:hover:text-brand-400"
           href="{% if section.page %}{{ section.page | prepend: site.baseurl }}{% else %}#{{ section.id }}{% endif %}">{{ section.name }}</a>
      {% endfor %}
    </div>

    <div class="flex items-center gap-2">
      <button type="button" id="theme-toggle" aria-label="Toggle dark mode"
              class="grid h-9 w-9 place-items-center rounded-lg border border-slate-200 text-slate-600 transition hover:border-brand-500 hover:text-brand-600 dark:border-slate-700 dark:text-slate-300 dark:hover:border-brand-400 dark:hover:text-brand-400">
        <svg class="h-4 w-4 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="hidden h-4 w-4 dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <a href="https://github.com/servirtium/servirtium-vcr"
         class="hidden items-center gap-2 rounded-lg bg-brand-500 px-4 py-2 text-sm font-semibold text-white transition hover:bg-brand-600 sm:inline-flex">
        GitHub
      </a>
      <button type="button" id="mobile-menu-toggle" aria-label="Toggle menu" aria-expanded="false"
              class="grid h-9 w-9 place-items-center rounded-lg border border-slate-200 text-slate-600 transition hover:border-brand-500 hover:text-brand-600 dark:border-slate-700 dark:text-slate-300 md:hidden">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </nav>

  <!-- Mobile menu -->
  <div id="mobile-menu" class="hidden border-t border-slate-200 bg-white px-6 py-4 dark:border-slate-800 dark:bg-slate-950 md:hidden">
    <div class="flex flex-col gap-3">
      {% for section in site.data.landing %}
        <a class="text-sm font-medium text-slate-600 dark:text-slate-300"
           href="{% if section.page %}{{ section.page | prepend: site.baseurl }}{% else %}#{{ section.id }}{% endif %}">{{ section.name }}</a>
      {% endfor %}
      <a class="mt-1 inline-flex w-max items-center gap-2 rounded-lg bg-brand-500 px-4 py-2 text-sm font-semibold text-white"
         href="https://github.com/servirtium/servirtium-vcr">GitHub</a>
    </div>
  </div>
</header>

<script>
  (function () {
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var root = document.documentElement;
      var isDark = root.classList.toggle('dark');
      try { localStorage.setItem('theme', isDark ? 'dark' : 'light'); } catch (e) {}
    });

    var menuBtn = document.getElementById('mobile-menu-toggle');
    var menu = document.getElementById('mobile-menu');
    if (menuBtn && menu) {
      menuBtn.addEventListener('click', function () {
        var open = menu.classList.toggle('hidden') === false;
        menuBtn.setAttribute('aria-expanded', String(open));
      });
      menu.addEventListener('click', function (e) {
        if (e.target.tagName === 'A') { menu.classList.add('hidden'); menuBtn.setAttribute('aria-expanded', 'false'); }
      });
    }
  })();
</script>
