---
layout: page
---
<article class="mx-auto max-w-4xl px-6 py-16">
  {% if page.back_url %}<a href="{{ page.back_url | prepend: site.baseurl }}" class="text-sm font-medium text-brand-600 hover:text-brand-700 dark:text-brand-400">&larr; {{ page.back_title }}</a>{% endif %}
  <header class="mt-6 border-b border-slate-200 pb-8 dark:border-slate-800">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1 class="mt-2 text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white md:text-4xl">{{ page.heading | default: page.title }}</h1>
    {% if page.lede %}<p class="mt-4 text-lg text-slate-600 dark:text-slate-300">{{ page.lede }}</p>{% endif %}
  </header>
  <div class="article-prose mt-8">
    {{ content }}
  </div>
</article>
