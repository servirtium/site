      local srv = assert(servirtium.playback("tapes/single_get.md"):port(0):start())
      local body = io.popen("curl -s " .. srv:base_url() .. "/ok"):read("*a")
      print(body, srv:last_kind() == servirtium.OK and "(clean match)" or "(MISMATCH)")
      srv:close()'
    code_lang: sh
  record: |
    local servirtium = require("servirtium")

    local srv = assert(servirtium.record("tapes/climate_api.md",
                                         "https://climatedataapi.worldbank.org")
        :port(0):start())

    io.popen("curl -s " .. srv:base_url() .. "/api/v1/countries"):read("*a")

    -- commit writes the markdown tape and returns "" on success
    assert(srv:commit() == "")
  playback: |
    local servirtium = require("servirtium")

    local srv = assert(servirtium.playback("tapes/climate_api.md"):port(0):start())
    local body = io.popen("curl -s " .. srv:base_url() .. "/api/v1/countries"):read("*a")

    assert(srv:last_kind() == servirtium.OK, srv:last_error())   -- optional: clean match
    srv:close()
  code_lang: lua
  extras:
  - title: Discard when the test fails
    note: close on a recording that was neither committed nor discarded writes nothing
      and returns the reason; discard drops it on purpose.
    code: |
      local srv = assert(servirtium.record(tape, upstream):port(0):start())
      local ok, err = pcall(function()
          -- ... drive the SUT, assert on it ...
      end)
      if ok then assert(srv:commit() == "") else srv:discard(); error(err, 0) end
  - title: Redact credentials
    note: redact_credentials scrubs the standard credential headers from the tape;
      redact_header, redact_query_param and redact_json_field cover named ones.
    code: |
      local srv = assert(servirtium.record(tape, upstream)
          :redact_credentials()
          :redact_json_field("secretKey")
          :port(0):start())
  - title: Volatile values and drift detection
    note: Rules tokenise values that change on every run so a re-record is byte-identical;
      fail_if_changed makes commit return a message only on real drift.
    code: |
      local srv = assert(servirtium.record(tape, upstream)
          :volatile_rule("response headers", "Date: {{serverDate}}")
          :volatile_rule("request path", "/orders/(?<orderId>[0-9a-f]{16})", "regex")
          :fail_if_changed()
          :port(0):start())
      -- ... drive SUT ...
      local err = srv:commit()   -- the fresh tape is still written; err is non-empty on drift
      if err ~= "" then error(err) end
  tests:
  - lua/tests/playback.lua
  - lua/tests/record.lua
  - lua/tests/mutation.lua
  - lua/example/consumer_example.lua
  - lua/tapes/single_get.md
  - lua/.example.ae
  readme: lua/README.md
  notes:
  - Builders raise a Lua error on a refused rule; start() returns nil, message on
