  mechanism: direct link (no FFI)
  mechanism_note: The library's ABI is already C, so the binding is one header (servirtium.h)
    and one source file (servirtium.c) that you compile with your own code; the native
    library is linked at build time, not dlopen-ed. The header adds enums, owned-string
    handling (sv_str / sv_free) and open-plus-start-plus-error in one call per mode.
  toolchain: A C99 compiler (cc/gcc/clang); POSIX popen needs -std=gnu99 only for
