    note: Rules name values that change on every run; the tape holds tokens and playback
      matches any live value of the right shape.
    code: |
      (Servirtium record: tape upstream: upstream)
          volatileRule: 'response headers' pattern: 'Date: {{serverDate}}';
          volatileRule: 'request path' pattern: '/orders/(?<orderId>[0-9a-f]{16})' kind: 'regex';
          startThenDo: [ :server | "... drive the SUT ..." server commit ].
