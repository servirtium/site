  - text: 'Export SERVIRTIUM_VCR_LIB BEFORE the image starts, then load the Tonel
      sources of the same tag into a copy of your image with Metacello (the repository
      path is pharo/src, not the repo root). Use load: ''tests'' to also load the
      SUnit suite.'
    code: |
      export SERVIRTIUM_VCR_LIB="$LIBDIR/libservirtium_vcr.$EXT"
      pharo --headless Pharo.image eval --save "
      Metacello new
        baseline: 'Servirtium';
        repository: 'github://servirtium/servirtium-vcr:@TAG@/pharo/src';
        load."
    code_lang: sh
  - text: In your own baseline, depend on it the same way. There is no Pharo catalog
      entry and no registry form.
    code: |
      spec baseline: 'Servirtium' with: [
        spec repository: 'github://servirtium/servirtium-vcr:@TAG@/pharo/src' ]
    code_lang: smalltalk
  - text: 'Check it: replay the canonical tape (expect ''ok-body'' #ok).'
    code: |
      mkdir -p tapes
      curl -fsSL -o tapes/single_get.md \
        https://raw.githubusercontent.com/servirtium/servirtium-vcr/@TAG@/pharo/src/Servirtium-Tests/tapes/single_get.md
      pharo --headless Pharo.image eval "
      | s | s := (Servirtium playback: 'tapes/single_get.md') port: 0; start.
      [ (ZnClient new get: s baseUrl , '/ok') displayString , ' ' , s lastKind printString ] ensure: [ s stop ]"
    code_lang: sh
  record: |
    "A record server writes its tape only on commit. startThenDo: always stops the
     server and discards the recording if the block raises."
    (Servirtium record: 'tapes/climate_api.md' upstream: 'https://climatedataapi.worldbank.org')
        port: 0;
        startThenDo: [ :server |
            ZnClient new get: server baseUrl , '/api/v1/countries'.
            server commit ].
  playback: |
    | server body |
    server := (Servirtium playback: 'tapes/climate_api.md') port: 0; start.
    body := ZnClient new get: server baseUrl , '/api/v1/countries'.
    self assert: server lastKind equals: #ok.    "optional: assert a clean match"
    server stop.

    "or auto-closing:"
    (Servirtium playback: 'tapes/climate_api.md') startThenDo: [ :server |
        ZnClient new get: server baseUrl , '/api/v1/countries'.
        self assert: server lastKind equals: #ok ].
  code_lang: smalltalk
  extras:
  - title: Redact credentials on record
    note: Scrubs the standard credential headers from the tape while the live test
      still sees real bytes.
    code: |
      (Servirtium record: 'tapes/api.md' upstream: 'https://api.example.com')
          redactCredentials;
          startThenDo: [ :server |
              ZnClient new get: server baseUrl , '/me'.
              server commit ].
  - title: Drop the recording on failure, or on purpose
    note: 'startThenDo: discards when the block raises; call server discard to drop
      a recording explicitly.'
    code: |
      (Servirtium record: tape upstream: upstream) startThenDo: [ :server |
          ZnClient new get: server baseUrl , '/ok'.
          self checkSomething
              ifTrue: [ server commit ]
              ifFalse: [ server discard ] ].
