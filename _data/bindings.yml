  - title: Rewrite the upstream's own URLs and scrub secrets
    note: RewriteUpstreamBase keeps the client on the VCR when the service sends absolute
      links back; Redact scrubs a field at commit time while the live test still sees
      real bytes.
    code: |
      Vcr.Record(tape, "http://tfs.example:8080/tfs")
          .RemoveTransportHeaders()
          .RedactCredentials()
          .RewriteUpstreamBase()
          .Redact(VcrField.ResponseBody, "Bearer abc123", "Bearer REDACTED")
          .Start();
