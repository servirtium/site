    note: The method is volatileRule because volatile is a D keyword; each call throws
      VcrException with the core's message.
    code: |
      vcr.volatileRule("request body", "<a:MessageID>urn:uuid:{{messageId}}</a:MessageID>");
      vcr.volatileMarkers(VolatileMarkers.dollarCurly);   // before any rule
      string report = vcr.volatileReport();
