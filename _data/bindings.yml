- slug: rust
  name: Rust
  family: native
  mechanism: libloading (dlopen)
  mechanism_note: A Cargo crate that dlopens the native library at run time through
    libloading. The crate is found by name inside the git repository at the release
    tag, so no root Cargo.toml is needed.
  toolchain: Stable Rust, edition 2021 (Cargo.toml sets no rust-version; the one dependency
    is libloading 0.8); run was on Rust 1.100
  dist: vendor
  dist_summary: 'No crates.io package: Cargo git dependency on the release tag, plus
    the release native library'
  library_lookup: SERVIRTIUM_VCR_LIB (absolute path), or .native_lib(path) on the
    builder. Cargo does not pass your shell's variable to another user or a container.
  install:
  - text: Fetch the native library for your OS/arch from the release into a directory
      outside your git tree and verify the checksum.
    code: |
      REL=https://github.com/servirtium/servirtium-vcr/releases/download/@TAG@
      LIBDIR="$HOME/.servirtium-vcr/@TAG@"; mkdir -p "$LIBDIR"
      LIB=libservirtium_vcr-@TAG@-linux-x86_64.so      # or -macos-arm64.dylib, -linux-arm64.so, ...
      curl -fsSL -o "$LIBDIR/$LIB" $REL/$LIB
      curl -fsSL -o "$LIBDIR/$LIB.sha256" $REL/$LIB.sha256
      ( cd "$LIBDIR" && { sha256sum -c $LIB.sha256 || shasum -a 256 -c $LIB.sha256; } )
    code_lang: sh
  - text: Add the crate as a (dev-)dependency from the tag.
    code: 'cargo add --dev servirtium --git https://github.com/servirtium/servirtium-vcr
      --tag @TAG@

      '
    code_lang: sh
  - text: Or in Cargo.toml directly.
    code: |
      [dev-dependencies]
      servirtium = { git = "https://github.com/servirtium/servirtium-vcr", tag = "@TAG@" }
    code_lang: toml
  - text: Point the crate at the library wherever cargo test runs.
    code: |
      export SERVIRTIUM_VCR_LIB="$HOME/.servirtium-vcr/@TAG@/libservirtium_vcr-@TAG@-linux-x86_64.so"
      cargo test
    code_lang: sh
  record: |
    use servirtium::Vcr;

    #[test]
    fn records_climate() {
        let rec = Vcr::record("tapes/climate_api.md", "https://climatedataapi.worldbank.org")
            .port(0)
            .start()
            .unwrap();

        let _ = ureq::get(&format!("{}/api/v1/countries", rec.base_url())).call();

        rec.commit().unwrap();   // consumes rec; the only thing that writes the tape
        // Dropping or close()-ing a record server WITHOUT commit()/discard() writes
        // nothing (close returns an error, drop panics).
    }
  playback: |
    use servirtium::{Outcome, Vcr};

    #[test]
    fn plays_climate() {
        let vcr = Vcr::playback("tapes/climate_api.md").port(0).start().unwrap();

        let body: String = ureq::get(&format!("{}/api/v1/countries", vcr.base_url()))
            .call().unwrap().into_string().unwrap();

        assert_eq!(Outcome::Ok, vcr.last_kind());   // optional: assert a clean match
        // `vcr` stops on drop.
    }
  code_lang: rust
  extras:
  - title: Discard on the failure path
    note: discard() consumes the server and drops the recording without writing a
      tape.
    code: |
      let rec = Vcr::record(tape, upstream).port(0).start().unwrap();
      if drive_the_sut(&rec.base_url()).is_err() {
          rec.discard();            // no tape
          return;
      }
      rec.commit().unwrap();
  - title: Redact credentials and JSON fields at record time
    note: Applied when the tape is written; the live test still sees real bytes. The
      _with form takes the replacement and the field.
    code: |
      use servirtium::{Field, Vcr};

      Vcr::record(tape, upstream)
          .redact_credentials()
          .redact_json_field_with("api_key", "[REDACTED]", Field::ResponseBody)
          .port(0)
          .start()
          .unwrap();
  - title: Drift detection
    note: With fail_if_changed, commit() writes the fresh tape and returns Err(VcrError)
      if it differs from the one on disk.
    code: |
      let rec = Vcr::record(tape, upstream).fail_if_changed().port(0).start().unwrap();
      // ... drive the SUT ...
      rec.commit()?;   // Err on drift; do not rely on drop, which panics
  tests:
  - rust/tests/playback.rs
  - rust/tests/record.rs
  - rust/tests/secrets.rs
  - rust/example/src/main.rs
  readme: rust/README.md
  notes:
  - 'Use tag =, not branch: the library must be at least as new as the Rust source.'
  - 'Do not use servirtium = "2" or any bare version: nothing is on crates.io, and
    a 1.x servirtium crate with #[servirtium_playback_test] macros is a different,
    removed API.'
  - 'Do not put the library in ~/.cargo/git/checkouts/...: that is a cache.'
  - The crate takes a process-wide lock for each VcrServer's lifetime, so parallel
    cargo test is safe without --test-threads=1.
  - Tape paths are relative to the test binary's working directory, which cargo test
    sets to the package root.
  verified: 'Real run on cachyos (Linux x86_64, Rust/cargo 1.100.0), not on the Mac
    (no Rust toolchain installed there): cargo add --dev servirtium --git ... --tag
    v2.0.0-alpha.20 in a fresh lib crate, release linux-x86_64 .so (sha256 verified)
    via SERVIRTIUM_VCR_LIB. The README ''Getting it'' test (replays_a_tape) passed.
    A second integration test recorded against a raw-socket upstream with redact_credentials
    + redact_json_field_with then commit() (secret and bearer token absent, [REDACTED]
    present), and record then discard() (no tape file); passed. Not run: macOS arm64,
