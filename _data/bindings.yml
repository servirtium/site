  - text: In your build.zig, create the module from the vendored file, link the library
      and bake the rpath (this is the repository's zig/example/build.zig, with the
      paths changed).
    code: |
      const servirtium = b.createModule(.{
          .root_source_file = b.path("third_party/servirtium-vcr/zig/src/servirtium.zig"),
      });
      const lib_dir = b.option([]const u8, "vcr-lib-dir", "directory holding libservirtium_vcr") orelse
          @panic("pass -Dvcr-lib-dir=<dir>");
      // exe_mod is your executable or test module, created with .link_libc = true
      exe_mod.addImport("servirtium", servirtium);
      exe_mod.addLibraryPath(.{ .cwd_relative = lib_dir });
      exe_mod.linkSystemLibrary("servirtium_vcr", .{});
      exe_mod.addRPath(.{ .cwd_relative = lib_dir });
    code_lang: zig
  - text: Build and run, pointing -Dvcr-lib-dir at the directory from step 1.
    code: 'zig build run -Dvcr-lib-dir="$LIBDIR"

      '
    code_lang: sh
  record: |
    const std = @import("std");
    const servirtium = @import("servirtium");

    pub fn main() !void {
        const a = std.heap.page_allocator;

        var rec = try servirtium.Record.init(a, "tapes/climate_api.md", "https://climatedataapi.worldbank.org")
            .port(0)
            .start();
        errdefer rec.discard();      // a failed test never leaves a half-recorded tape

        const base = try rec.baseUrl();
        defer a.free(base);
        // ... point your HTTP client at `base` and make requests ...

        try rec.commit();            // the only way a recording becomes a tape
    }
  playback: |
    const std = @import("std");
    const servirtium = @import("servirtium");

    pub fn main() !void {
        const a = std.heap.page_allocator;

        var srv = try servirtium.Playback.init(a, "tapes/climate_api.md")
            .port(0)             // 0 picks a free port
            .start();
        defer srv.close() catch {};

        const base = try srv.baseUrl();
        defer a.free(base);
        // ... point your HTTP client at `base` and make requests ...

        if (srv.lastKind() != .ok) {
            const e = try srv.lastError();
            defer a.free(e);
            std.debug.print("mismatch: {s}\n", .{e});
        }
    }
  code_lang: zig
  extras:
