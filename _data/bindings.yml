  - pharo/src/Servirtium-Tests/ServirtiumRecordTest.class.st
  - pharo/src/Servirtium-Tests/ServirtiumVolatileTest.class.st
  - pharo/src/Servirtium-Tests/tapes/single_get.md
  - pharo/.example.ae
  readme: pharo/README.md
  notes:
  - 'SERVIRTIUM_VCR_LIB is read from the OS environment when the image starts: export
    it before launching, or call ServirtiumLibrary libPath: first. It must be an absolute
    path to an existing file.'
  - The library and the Smalltalk source must be the same tag; an older library fails
    at the first call naming an aether_vcr_embed_ symbol.
  - Use the -musl asset on Alpine. Do not put the library in the image directory or
