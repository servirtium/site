    set SERVIRTIUM_VCR_LIB to its absolute path.'
  - 'Do not ProjectReference the repo''s dotnet/ projects: they build only through
    aeb. A tape recorded with RedactCredentials holds tokens, not real values: apply
    the same preset on the playback builder when the client sends a real credential.'
  verified: 'On linux x64 (cachyos, .NET SDK 10.0.114): restored the release Servirtium.Vcr.2.0.0-alpha.20.nupkg
    (sha256 checked) from a local feed into a fresh console project, ran the README
    Program.cs check (ok-body Ok), then a program running the playback snippet (AssertNoMismatches,
    AssertAllConsumed), the record snippet (RemoveTransportHeaders, RedactCredentials,
    Commit) against a local HttpListener upstream, and Record with neither Commit
    nor Discard (throws VcrException ''record VCR closed without commit or discard'').
    Ran dotnet/net48/check.sh against the release nupkg: 0 failures (AnyCPU both engines,
    RID win-x64, x64, x86 refused with SVCR001, transitive, packages.config incl.
