# One entry per language. Drives /languages/, each language page, its agent prompt, and llms-full.txt.
# Tokens @TAG@ @VER@ @PYVER@ come from _data/release.yml.
- slug: go
  name: Go
  family: native
  mechanism: cgo
  mechanism_note: The module cgo-links libservirtium_vcr at build time (-lservirtium_vcr),
    not via a runtime dlopen. You supply the library directory through CGO_LDFLAGS
    (-L plus a baked-in rpath), so the built test binary needs no LD_LIBRARY_PATH.
  toolchain: Go 1.21+ (go.mod says 1.21) with CGO_ENABLED=1 and a C compiler
  dist: vendor
  dist_summary: 'No registry package: go get the go/v2 module at the release tag,
    plus the release native library'
  library_lookup: 'Link time: cgo''s -lservirtium_vcr must find a file literally named
    libservirtium_vcr.so / .dylib. Point CGO_LDFLAGS at the directory (-L and -Wl,-rpath).
    SERVIRTIUM_VCR_LIB is for the repo''s own tests, not for consumers.'
  install:
  - text: Add the Go module. It lives in the go/ subdirectory of servirtium-vcr with
      the major version in the path (/v2); each release is also tagged go/<tag>, which
      is what go get reads.
    code: 'go get github.com/servirtium/servirtium-vcr/go/v2@@TAG@

      '
    code_lang: sh
  - text: Fetch the native library for your OS/arch from the release into ./native,
      verify the checksum, and copy it to the plain name cgo links against.
    code: |
      REL=https://github.com/servirtium/servirtium-vcr/releases/download/@TAG@
      LIB=libservirtium_vcr-@TAG@-macos-arm64.dylib      # or -linux-x86_64.so, -linux-arm64.so, ...
      mkdir -p native
      curl -fsSL -o native/$LIB $REL/$LIB
      curl -fsSL -o native/$LIB.sha256 $REL/$LIB.sha256
      ( cd native && { sha256sum -c $LIB.sha256 || shasum -a 256 -c $LIB.sha256; } )
      cp native/$LIB native/libservirtium_vcr.dylib      # .so on Linux/FreeBSD
    code_lang: sh
  - text: Tell cgo where the library is, in every shell and CI step that runs go build
      / go test.
    code: |
      export CGO_LDFLAGS="-L$PWD/native -Wl,-rpath,$PWD/native"
      go test ./...
    code_lang: sh
  - text: 'macOS only, for v2.0.0-alpha.20: the released .dylib carries a CI build
      path as its install name, so a linked Go binary dies at start with ''Library
      not loaded: /home/runner/...''. Rewrite the install name once, after the copy
      (ad-hoc re-sign included).'
    code: |
      install_name_tool -id @rpath/libservirtium_vcr.dylib native/libservirtium_vcr.dylib
      codesign -f -s - native/libservirtium_vcr.dylib
    code_lang: sh
  record: |
    package mypkg_test

    import (
        "net/http"
        "testing"

        servirtium "github.com/servirtium/servirtium-vcr/go/v2"
    )

    func TestRecordClimate(t *testing.T) {
        srv, err := servirtium.Record("tapes/climate_api.md", "https://climatedataapi.worldbank.org").
            Port(0). // 0 = OS-assigned
            Start()
        if err != nil {
            t.Fatal(err)
        }
        defer srv.Discard() // no-op after Commit; on a failure path it drops the recording

        resp, err := http.Get(srv.BaseURL() + "/api/v1/countries")
        if err != nil {
            t.Fatal(err)
        }
        resp.Body.Close()

        if err := srv.Commit(); err != nil { // the only thing that writes the tape
            t.Fatal(err)
        }
    }
  playback: |
    func TestPlaybackClimate(t *testing.T) {
        srv, err := servirtium.Playback("tapes/climate_api.md").Port(0).Start()
        if err != nil {
            t.Fatal(err)
        }
        defer srv.Close()

        resp, err := http.Get(srv.BaseURL() + "/api/v1/countries")
        if err != nil {
            t.Fatal(err)
        }
        resp.Body.Close()

        if srv.LastKind() != servirtium.Ok { // optional: assert a clean match
            t.Fatal(srv.LastError())
        }
    }
  code_lang: go
  extras:
  - title: Discard on the failure path
    note: 'defer Discard() right after Start(): after a Commit it does nothing, but
      if the test fails first the half-finished recording is dropped and no tape is
      written.'
    code: |
      srv, _ := servirtium.Record(tape, upstream).Port(0).Start()
      defer srv.Discard()
      // ... drive the SUT; t.Fatal here leaves no tape behind ...
      if err := srv.Commit(); err != nil {
          t.Fatal(err)
      }
  - title: Redact credentials and JSON fields at record time
    note: Redactions apply when the tape is written, so the live test still sees real
      bytes while the committed tape is clean.
    code: |
      servirtium.Record(tape, upstream).
          RedactCredentials().
          RedactJSONFieldWith("api_key", "[REDACTED]", servirtium.ResponseBody).
          Start()
  - title: Drift detection
    note: With FailIfChanged, Commit still writes the fresh tape but returns an error
      if it differs from the one on disk, so git diff shows the drift.
    code: |
      srv, _ := servirtium.Record(tape, upstream).FailIfChanged().Start()
      // ... drive the SUT ...
      if err := srv.Commit(); err != nil {
          t.Fatal(err)
      }
  tests:
  - go/record_test.go
  - go/playback_test.go
  - go/secrets_test.go
  - go/mutation_test.go
  - go/example/main.go
  readme: go/README.md
  notes:
  - 'cgo is required: CGO_ENABLED=0 fails with ''build constraints exclude all Go
    files''. A C compiler must be on PATH.'
  - The import path must end in /go/v2; .../servirtium-vcr/go without /v2 is wrong.
  - go mod vendor copies Go files only; the native library does not follow. Do not
    write into GOMODCACHE.
  - Go's http.Client sends a default User-Agent; under StrictHeaders() that header
    must be on the recorded request block or be suppressed.
  - v2.0.0-alpha.20 macOS dylib has a bogus install name (a CI path); see the install
    step.
  verified: 'Real run on macOS arm64 (Go 1.27.4): go get the go/v2 module at v2.0.0-alpha.20,
    release macos-arm64 dylib (sha256 verified) copied to native/libservirtium_vcr.dylib,
    CGO_LDFLAGS as above. A go test passed three cases: playback of single_get.md
    (body ok-body, LastKind Ok), record against an httptest upstream then Commit then
    replay of the new tape, and Record then Discard (no tape file). The UNMODIFIED
    release dylib fails at test start with dyld ''Library not loaded: /home/runner/work/.../libservirtium_vcr.so''
    (install name); the run passed only after install_name_tool -id @rpath/... + codesign.
    Redact/FailIfChanged extras and the deferred-Discard-after-Commit idiom were checked
    against servirtium.go (Discard returns when the handle is already nil) but not
    executed.'
- slug: python
  name: Python
  family: native
  mechanism: ctypes
  mechanism_note: A pure-Python package that loads the native library at run time
    through the standard-library ctypes module. No compiler and no runtime dependencies.
  toolchain: Python 3.9+ (setup.py python_requires)
  dist: vendor
  dist_summary: 'No PyPI package (the PyPI name ''servirtium'' is the old 1.x): pip
    install the python/ subdirectory of the tag, plus the release native library'
  library_lookup: SERVIRTIUM_VCR_LIB (absolute path to the library), or native_lib='/abs/path'
    on servirtium.playback(...) / record(...). Set it in whatever process runs the
    tests.
  install:
  - text: Fetch the native library for your OS/arch from the release into a directory
      outside your git tree and verify the checksum.
    code: |
      REL=https://github.com/servirtium/servirtium-vcr/releases/download/@TAG@
      LIBDIR="$HOME/.servirtium-vcr/@TAG@"; mkdir -p "$LIBDIR"
      LIB=libservirtium_vcr-@TAG@-macos-arm64.dylib      # or -linux-x86_64.so, -linux-arm64.so, ...
      curl -fsSL -o "$LIBDIR/$LIB" $REL/$LIB
      curl -fsSL -o "$LIBDIR/$LIB.sha256" $REL/$LIB.sha256
      ( cd "$LIBDIR" && { sha256sum -c $LIB.sha256 || shasum -a 256 -c $LIB.sha256; } )
    code_lang: sh
  - text: 'Install the package from the tag (the python/ subdirectory of the GitHub
      archive). Do not run pip install servirtium: that is the unrelated 1.x package.'
    code: |
      python3 -m venv .venv && . .venv/bin/activate
      python -m pip install "https://github.com/servirtium/servirtium-vcr/archive/refs/tags/@TAG@.tar.gz#subdirectory=python"
    code_lang: sh
  - text: Point the package at the library wherever your tests run, and check servirtium.__version__
      is @PYVER@.
    code: |
      export SERVIRTIUM_VCR_LIB="$HOME/.servirtium-vcr/@TAG@/libservirtium_vcr-@TAG@-macos-arm64.dylib"
      python -c "import servirtium; print(servirtium.__version__)"
    code_lang: sh
  - text: As a requirements.txt / pyproject dependency line.
    code: 'servirtium @ https://github.com/servirtium/servirtium-vcr/archive/refs/tags/@TAG@.tar.gz#subdirectory=python

      '
    code_lang: text
  record: |
    import urllib.request
    import servirtium

    with servirtium.record("tapes/climate_api.md",
                           "https://climatedataapi.worldbank.org").port(0).start() as vcr:
        urllib.request.urlopen(f"{vcr.base_url}/api/v1/countries", timeout=10).read()
        vcr.commit()   # the only thing that writes the tape
    # Leaving the with block WITHOUT commit() writes nothing and raises VcrError.
    # A with block that raises discards the recording and re-raises your exception.
  playback: |
    import urllib.request
    import servirtium

    with servirtium.playback("tapes/climate_api.md").port(0).start() as vcr:   # 0 = OS-assigned
        body = urllib.request.urlopen(f"{vcr.base_url}/api/v1/countries").read()
        assert vcr.last_kind is servirtium.Outcome.OK, vcr.last_error          # optional: assert a clean match
  code_lang: python
  extras:
  - title: A failing with-block discards the recording
    note: If your code raises inside the with block, the recording is dropped, no
      tape is written, and your exception propagates.
    code: |
      try:
          with servirtium.record("tapes/x.md", upstream).port(0).start() as vcr:
              urllib.request.urlopen(vcr.base_url + "/x").read()
              raise RuntimeError("test failed")   # -> no tapes/x.md
      except RuntimeError:
          pass
  - title: Redact credentials and JSON fields at record time
    note: Applied when the tape is written; the live test still sees real bytes.
    code: |
      with servirtium.record(tape, upstream) \
              .redact_credentials() \
              .redact_json_field("api_key", "[REDACTED]", field=servirtium.Field.RESPONSE_BODY) \
              .port(0).start() as vcr:
          ...   # drive the SUT
          vcr.commit()
  - title: Drift detection
    note: With fail_if_changed, commit() writes the fresh tape and raises VcrError
      if it differs from the one on disk.
    code: |
      with servirtium.record(tape, upstream).fail_if_changed().port(0).start() as vcr:
          ...   # drive the SUT
          vcr.commit()   # raises VcrError on drift
  tests:
  - python/test/test_playback.py
  - python/test/test_record.py
  - python/test/test_secrets.py
  - python/test/test_record_mutation.py
  - python/example/consumer_example.py
  readme: python/README.md
  notes:
  - The version in the install URL and the library must be the same tag; a library
    older than the package fails at the first call naming a missing aether_vcr_embed_
    symbol.
  - OSError 'could not load native VCR library' means SERVIRTIUM_VCR_LIB is unset
    in the process running the tests (an IDE or CI step does not inherit your shell)
    or is not an absolute path; on Alpine take the -musl library.
  - Do not copy the library into site-packages/servirtium/native by hand (lost on
    reinstall); do not commit it.
  - 'Windows: take the .dll asset by hand and give SERVIRTIUM_VCR_LIB its full path.'
  verified: 'Real run on macOS arm64 (system Python 3.9.6, the stated floor): pip
    install of the python/ subdirectory from the v2.0.0-alpha.20 GitHub archive into
    a fresh venv (servirtium.__version__ == 2.0.0a20), release macos-arm64 dylib via
    SERVIRTIUM_VCR_LIB (sha256 verified; the unmodified dylib loads fine under ctypes).
    Ran: the README ''Getting it'' playback check (ok-body, Outcome.OK); the README
    ''Record and replay a local service'' script with vcr.commit() added (records
    hello.md, replays it with the upstream stopped); the same script WITHOUT commit()
    (raises VcrError, no hello.md); a with-block that raises (no tape); redact_credentials
    + redact_json_field (tape has neither the secret nor the bearer token, has [REDACTED]).
    fail_if_changed extra checked against _vcr.py, not run.'
- slug: java
  name: Java
  family: native
  mechanism: Java Foreign Function & Memory API (java.lang.foreign, Project Panama)
  mechanism_note: Downcall handles into libservirtium_vcr through java.lang.foreign
    (final since JDK 22); no JNA, no JNI. The fat jar bundles the six natives under
    /native/<os>-<arch>/ and extracts the right one at run time.
  toolchain: JDK 22 or newer (maven.compiler.release 22 in java/pom.xml; tested on
    JDK 25), Maven or any JVM build tool; run with --enable-native-access=ALL-UNNAMED
  dist: artifact
  dist_summary: 'Ships: servirtium-vcr-@VER@.jar (fat jar, six natives); install into
    ~/.m2 as dev.servirtium:vcr'
  library_lookup: Bundled in the jar and extracted at run time; SERVIRTIUM_VCR_LIB
    (a libservirtium_vcr from the release page) overrides, and is needed only for
    a platform the jar does not bundle (musl, FreeBSD) or a lean dev build.
  install:
  - text: 'Install the release fat jar (six natives bundled: linux, macOS, Windows
      x86_64 and arm64) into your local Maven repository as dev.servirtium:vcr. It
      is not on Maven Central yet, so there is nothing to fetch by coordinate.'
    code: |-
      TAG=@TAG@; VER=@VER@
      curl -fsSLO https://github.com/servirtium/servirtium-vcr/releases/download/$TAG/servirtium-vcr-$VER.jar
      mvn -q install:install-file -Dfile=servirtium-vcr-$VER.jar -DgroupId=dev.servirtium -DartifactId=vcr -Dversion=$VER -Dpackaging=jar
      mvn -q dependency:get -Dartifact=dev.servirtium:vcr:$VER && echo OK
    code_lang: sh
  - text: 'Add the dependency (test scope). Gradle: repositories { mavenLocal() };
      sbt: Resolver.mavenLocal; deps.edn: {dev.servirtium/vcr {:mvn/version "@VER@"}}.'
    code: |-
      <dependency>
        <groupId>dev.servirtium</groupId>
        <artifactId>vcr</artifactId>
        <version>@VER@</version>
        <scope>test</scope>
      </dependency>
    code_lang: xml
  - text: Run the test JVM with --enable-native-access=ALL-UNNAMED, for example in
      Surefire.
    code: |-
      <plugin>
        <artifactId>maven-surefire-plugin</artifactId>
        <configuration>
          <argLine>--enable-native-access=ALL-UNNAMED</argLine>
        </configuration>
      </plugin>
    code_lang: xml
  record: |
    import dev.servirtium.vcr.*;
    import java.net.URI;
    import java.net.http.*;

    VcrServer vcr = Vcr.record("tapes/climate_api.md", "https://climatedataapi.worldbank.org")
            .removeTransportHeaders()
            .redactCredentials()
            .port(0)
            .start();
    try {
        HttpClient client = HttpClient.newBuilder().version(HttpClient.Version.HTTP_1_1).build();
        client.send(HttpRequest.newBuilder(URI.create(vcr.baseUrl() + "/api/v1/countries")).build(),
                    HttpResponse.BodyHandlers.ofString());
        vcr.commit();                 // writes the tape; without commit() or discard(), close() throws
    } catch (Exception e) {
        vcr.discard();                // a failing test drops the recording
        throw e;
    } finally {
        vcr.close();
    }
  playback: |
    import dev.servirtium.vcr.*;
    import java.net.URI;
    import java.net.http.*;

    try (VcrServer vcr = Vcr.playback("tapes/climate_api.md").port(0).start()) {
        HttpClient client = HttpClient.newHttpClient();
        HttpResponse<String> r = client.send(
            HttpRequest.newBuilder(URI.create(vcr.baseUrl() + "/api/v1/countries")).build(),
            HttpResponse.BodyHandlers.ofString());

        assertEquals(Outcome.OK, vcr.lastKind());   // optional: assert a clean match
        vcr.assertNoMismatches();                    // nothing was refused
        vcr.assertAllConsumed();                     // every recorded interaction was replayed
    }
  code_lang: java
  extras:
  - title: Scrub secrets and sort for a stable re-record
    note: Header presets plus opt-in stable order; sorted JSON is only written pretty-printed,
      so prettyJson is required or commit() throws. Register the same credential preset
      on the playback builder so a real token still matches the scrubbed tape.
    code: |
      Vcr.record(tape, upstream)
          .removeTransportHeaders()
          .redactCredentials()                 // Authorization, cookies, X-Api-Key, X-Auth-Token
          .prettyJson(2)
          .sortJsonKeys()                      // object keys sorted at every depth
          .sortResponseHeaders()               // header lines by name
          .start();

      Vcr.playback(tape).redactCredentials().port(0).start();
  - title: Volatile values
    note: 'One rule set for record, playback and drift detection: captured ids and
      timestamps become {{token}}s in the tape, and playback binds what no request
      carries.'
    code: |
      Vcr.record(tape, upstream)
          .volatileRule("request path", "/orders/{{order}}/items")
          .volatileRule("response headers", "Date: {{serverDate}}")
          .start();

      Vcr.playback(tape)
          .bind("serverDate", "Fri, 13 Nov 2026 09:41:07 GMT")
          .start();
  - title: Replay only a slice of a tape
    note: Interaction numbers are 0-based and inclusive; a request outside the range
      is never served.
    code: 'Vcr.playback(tape).playbackRange(4, 6).start();   // playbackRange(4) =
      4 through the last

      '
  tests:
  - java/example/src/test/java/com/example/PlaybackConsumerTest.java
  - java/example/src/test/java/com/example/RecordConsumerTest.java
  - java/src/test/java/dev/servirtium/vcr/RecordTest.java
  - java/src/test/java/dev/servirtium/vcr/VolatileValuesTest.java
  readme: java/README.md
  notes:
  - JDK 22+ is required; older JDKs fail with UnsupportedClassVersionError.
  - Pass --enable-native-access=ALL-UNNAMED to the test JVM, or JDK 24+ prints a restricted-method
    warning.
  - The JDK HttpClient defaults to HTTP/2 and sends upgrade headers (HTTP2-Settings,
    Upgrade); under strictHeaders() build it with HttpClient.Version.HTTP_1_1 or removeHeader
    them.
  - Closing a record server with neither commit() nor discard() writes nothing and
    throws VcrException.
  - 'Not on Maven Central: install the release jar into ~/.m2 (the dev.servirtium:vcr
    coordinates are final).'
  verified: Playback and record+commit+discard snippets run on macOS arm64 with openjdk
    25 and the release servirtium-vcr-2.0.0-alpha.20.jar (sha256 checked against SHA256SUMS.txt)
    against java/example's single_get.md tape and a local JDK upstream; the extras
    (removeTransportHeaders, redactCredentials, prettyJson, sortJsonKeys, sortResponseHeaders,
    playbackRange, close without commit throwing) also run. java/example's two tests
    pass (mvn test, JDK 25, linux) from the same jar. volatileRule/bind mirror VolatileValuesTest
    and were not run by me. assertNoMismatches/assertAllConsumed are in VcrServer's
    source but were not run in Java (run in .NET).
- slug: dotnet
  name: ".NET"
  family: native
  mechanism: P/Invoke (NativeLibrary)
  mechanism_note: One C# assembly P/Invokes the aether_vcr_embed_* C ABI; the nupkg
    carries the engine under runtimes/<rid>/native/ for eight RIDs (linux x64/arm64
    glibc and musl, osx x64/arm64, win x64/arm64) and targets net8.0 and net48. C#
    and F# share it.
  toolchain: ".NET 8 SDK or newer for net8.0 (verified here with the .NET 10 SDK,
    nupkg consumed on net10.0); .NET Framework 4.8 via the net48 target (64-bit only;
    SDK-style or packages.config projects)"
  dist: artifact
  dist_summary: 'Ships: Servirtium.Vcr.@VER@.nupkg (net8.0 + net48, eight RIDs); use
    the release directory as a local NuGet feed'
  library_lookup: Deployed from the package's runtimes/<rid>/native/ (NuGet, or build/net48/Servirtium.Vcr.targets
    on .NET Framework); no SERVIRTIUM_VCR_LIB. SERVIRTIUM_VCR_LIB wins over the packaged
    copy and is needed only for FreeBSD (no RID in the package).
  install:
  - text: Put the release package in a local NuGet feed (checksum-verified) and declare
      it in a nuget.config. It is not on nuget.org yet. Run from your own project
      directory.
    code: |-
      set -eu
      VER=@VER@
      REL=https://github.com/servirtium/servirtium-vcr/releases/download/@TAG@
      mkdir -p nupkgs
      curl -fsSL -o nupkgs/Servirtium.Vcr.$VER.nupkg $REL/Servirtium.Vcr.$VER.nupkg
      curl -fsSL -o nupkgs/Servirtium.Vcr.$VER.nupkg.sha256 $REL/Servirtium.Vcr.$VER.nupkg.sha256
      ( cd nupkgs && { sha256sum -c Servirtium.Vcr.$VER.nupkg.sha256 2>/dev/null || shasum -a 256 -c Servirtium.Vcr.$VER.nupkg.sha256; } )
      [ -f nuget.config ] || dotnet new nugetconfig
      dotnet nuget add source "$PWD/nupkgs" --name servirtium-local --configfile nuget.config
    code_lang: sh
  - text: Add the dependency. A prerelease needs the explicit version.
    code: |-
      dotnet add package Servirtium.Vcr --version @VER@
      # or in the .csproj:
      # <PackageReference Include="Servirtium.Vcr" Version="@VER@" />
    code_lang: sh
  - text: 'Check it: replay a recorded tape (the engine is deployed from the package).'
    code: |-
      mkdir -p tapes
      curl -fsSL -o tapes/single_get.md https://raw.githubusercontent.com/servirtium/servirtium-vcr/@TAG@/dotnet/example/tapes/single_get.md
      cat > Program.cs <<'CS'
      using Servirtium.Vcr;
      using var vcr = Vcr.Playback("tapes/single_get.md").Port(0).Start();
      using var http = new HttpClient();
      Console.WriteLine((await http.GetStringAsync(vcr.BaseUrl + "/ok")).Trim() + " " + vcr.LastKind);   // -> ok-body Ok
      CS
      dotnet run
    code_lang: sh
  - text: ".NET Framework 4.8: the same package serves it (lib/net48/) and its build
      targets copy the engine (see notes). Target a 64-bit process."
    code: |-
      <PropertyGroup>
        <TargetFramework>net48</TargetFramework>
        <PlatformTarget>x64</PlatformTarget>          <!-- or ARM64; AnyCPU libraries/test projects get both engines -->
        <Prefer32Bit>false</Prefer32Bit>              <!-- for an exe -->
      </PropertyGroup>
    code_lang: xml
  record: |
    using Servirtium.Vcr;

    using var vcr = Vcr.Record("tapes/climate_api.md", "https://climatedataapi.worldbank.org")
        .RemoveTransportHeaders()
        .RedactCredentials()
        .Port(0)
        .Start();
    using var client = new HttpClient { BaseAddress = new Uri(vcr.BaseUrl) };
    try
    {
        await client.GetStringAsync("/api/v1/countries");
        vcr.Commit();      // writes the tape; disposing with neither Commit() nor Discard() throws
    }
    catch
    {
        vcr.Discard();     // a failing test drops the recording
        throw;
    }
  playback: |
    using Servirtium.Vcr;

    using var vcr = Vcr.Playback("tapes/climate_api.md").Port(0).Start();
    using var client = new HttpClient { BaseAddress = new Uri(vcr.BaseUrl) };

    var body = await client.GetStringAsync("/api/v1/countries");
    Assert.Equal(VcrOutcome.Ok, vcr.LastKind);   // optional: assert a clean match
    vcr.AssertNoMismatches();                     // nothing was refused
    vcr.AssertAllConsumed();                      // every recorded interaction was replayed
  code_lang: csharp
  extras:
  - title: Volatile values
    note: Typed scopes (VolatileScope); the string overload is gone. Captured values
      become {{tokens}} in the tape; playback binds what no request carries.
    code: |
      Vcr.Record(tape, upstream)
          .PrettyXml(2)
          .VolatileRule(VolatileScope.RequestBody, "<a:MessageID>urn:uuid:{{messageId}}</a:MessageID>")
          .VolatileRule(VolatileScope.ResponseHeaders, "Date: {{serverDate}}")
          .Start();

      using var vcr = Vcr.Playback(tape).PrettyXml(2)
          .Bind("serverDate", DateTime.UtcNow.ToString("R"))
          .Start();
