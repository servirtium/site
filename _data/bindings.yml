  - dotnet/Servirtium.Vcr.Tests/RecordTests.cs
  - dotnet/Servirtium.Vcr.Tests/VolatileValuesTests.cs
  - dotnet/Servirtium.Vcr.Tests/SubstituteTests.cs
  - dotnet/net48/check.sh
  readme: dotnet/README.md
  notes:
  - There is no 32-bit engine. PlatformTarget x86, RuntimeIdentifier win-x86, or an
    AnyCPU exe with Prefer32Bit (the classic console template's default) fails the
    build with SVCR001; set PlatformTarget x64 (or ARM64), Prefer32Bit false for an
    exe, and a 64-bit test host.
  - ".NET Framework 4.8: an SDK-style PackageReference with a RuntimeIdentifier gets
    the engine from NuGet; otherwise the package's build/net48/Servirtium.Vcr.targets
    copies it (x64 or ARM64 PlatformTarget: that engine beside the assembly; AnyCPU:
    both under runtimes\\win-x64\\native\\ and runtimes\\win-arm64\\native\\, and
    the binding loads the one for the process). A project reaching the package through
    a ProjectReference gets it via buildTransitive/net48/; packages.config projects
    get the import added on install."
