  - 'The interpreter must be the one the extension was built for: lua5.4. A mismatch
    reads ''version mismatch: app. needs 504.0, Lua core provides 505.0''.'
  - keep servirtium_native.so and the library together (the rpath is $ORIGIN / @loader_path).
