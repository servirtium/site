  name: F#
  family: clr
  mechanism: Servirtium.Vcr (C#) assembly, no second FFI
  mechanism_note: F# consumes the shared Servirtium.Vcr C# assembly (P/Invoke over
    the aether_vcr_embed_* C ABI); the one source file Servirtium.fs adds loan-pattern
    combinators and curry-friendly members.
  toolchain: ".NET 8 SDK or newer (the repo's F# projects target net8.0 with RollForward
    LatestMajor; verified with the .NET 10 SDK)"
  dist: vendor
  dist_summary: Uses the release Servirtium.Vcr.@VER@.nupkg (no F#-specific package
    exists); copy the one file Servirtium.fs for the combinators
  library_lookup: 'Same as .NET: deployed from the Servirtium.Vcr package''s runtimes/<rid>/native/;
    SERVIRTIUM_VCR_LIB overrides (only FreeBSD needs it).'
  install:
  - text: Put the release Servirtium.Vcr package in a local NuGet feed and add it
      to your F# project. There is no Servirtium.Vcr.FSharp package on any feed or
      release page; do not add that reference.
    code: |-
      set -eu
      VER=@VER@
      REL=https://github.com/servirtium/servirtium-vcr/releases/download/@TAG@
      mkdir -p nupkgs
      curl -fsSL -o nupkgs/Servirtium.Vcr.$VER.nupkg $REL/Servirtium.Vcr.$VER.nupkg
      curl -fsSL -o nupkgs/Servirtium.Vcr.$VER.nupkg.sha256 $REL/Servirtium.Vcr.$VER.nupkg.sha256
      ( cd nupkgs && { sha256sum -c Servirtium.Vcr.$VER.nupkg.sha256 2>/dev/null || shasum -a 256 -c Servirtium.Vcr.$VER.nupkg.sha256; } )
      [ -f nuget.config ] || dotnet new nugetconfig
      dotnet nuget add source "$PWD/nupkgs" --name servirtium-local --configfile nuget.config
      dotnet add package Servirtium.Vcr --version $VER
    code_lang: sh
  - text: 'Optional: the F# combinators are one source file. Copy it in and compile
      it before the files that use it.'
    code: |-
      curl -fsSL -o Servirtium.fs https://raw.githubusercontent.com/servirtium/servirtium-vcr/@TAG@/fsharp/Servirtium.Vcr.FSharp/Servirtium.fs
      # in the .fsproj, above Program.fs:
      #   <Compile Include="Servirtium.fs" />
    code_lang: sh
  - text: 'Check it: replay a recorded tape.'
    code: |-
      mkdir -p tapes
      curl -fsSL -o tapes/single_get.md https://raw.githubusercontent.com/servirtium/servirtium-vcr/@TAG@/fsharp/tapes/single_get.md
      cat > Program.fs <<'FS'
      open System.Net.Http
      open Servirtium.Vcr
      [<EntryPoint>]
      let main _ =
          use vcr = Vcr.Playback("tapes/single_get.md").Port(0).Start()
          use http = new HttpClient()
          printfn "%s %A" (http.GetStringAsync(vcr.BaseUrl + "/ok").Result.Trim()) vcr.LastKind   // -> ok-body Ok
          0
      FS
      dotnet run
    code_lang: sh
  record: |
    open System.Net.Http
    open Servirtium.Vcr
    open Servirtium.Vcr.FSharp

    // usingRecord disposes on every path and discards the recording if the body throws.
    // The body must call Commit(): a recording left uncommitted writes nothing and throws.
    Servirtium.usingRecord "https://climatedataapi.worldbank.org" "tapes/climate_api.md" (fun vcr ->
        use client = new HttpClient()
        client.GetStringAsync(Servirtium.baseUrl vcr + "/api/v1/countries").Result |> ignore
        vcr.Commit())
  playback: |
    open System.Net.Http
    open Servirtium.Vcr
    open Servirtium.Vcr.FSharp

    Servirtium.usingPlayback "tapes/single_get.md" (fun vcr ->
        use client = new HttpClient()
        let body = client.GetStringAsync(Servirtium.baseUrl vcr + "/ok").Result
        assert (body = "ok-body")
        assert (Servirtium.matchedCleanly vcr))     // clean match
  code_lang: fsharp
  extras:
  - title: Builder steps as pipeline functions
    note: Presets, redactions and the opt-in stable order pipe over a RecordBuilder;
      the JSON rules need prettyJson, else committing throws VcrException.
    code: |
      Vcr.Record(tape, upstream)
      |> Servirtium.removeTransportHeaders
      |> Servirtium.redactCredentials
      |> Servirtium.prettyJson 2
      |> Servirtium.sortJsonKeys
      |> Servirtium.sortJsonArray "versions" "/created"
      |> Servirtium.sortResponseHeaders
      |> fun b -> b.Start()
  - title: Replay only a slice of a tape
    note: Interaction numbers are 0-based and inclusive; to < 0 means through the
      last.
    code: 'Vcr.Playback(tape) |> Servirtium.playbackRange 4 6 |> fun b -> b.Start()

      '
  tests:
  - fsharp/example/Program.fs
  - fsharp/Servirtium.Vcr.FSharp.Tests/PlaybackTest.fs
  - fsharp/Servirtium.Vcr.FSharp/Servirtium.fs
  readme: fsharp/README.md
  notes:
  - Everything in the .NET notes applies (NU1101/NU1102, 64-bit only, no SERVIRTIUM_VCR_LIB
    unless FreeBSD).
  - 'Compile order matters in F#: Servirtium.fs must come before any file that uses
    Servirtium.usingPlayback.'
  - 'Do not ProjectReference the repo''s fsharp/ or dotnet/ projects: they build only
    through aeb. The repo''s own fsharp/example references Servirtium.Vcr.FSharp from
    a feed that aeb builds locally; that package is not published.'
  - usingRecord discards the recording if the body throws; if the body returns without
    Commit() or Discard() it writes nothing and throws.
