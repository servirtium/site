    note: Vcr is a non-copyable struct; scope(failure) discard drops the recording
      when anything throws, scope(success) or an explicit flush commits it.
    code: |
      auto rec = Vcr.record(tape, upstream);
      scope (failure) rec.discard();
      // ... drive the SUT, assert on it ...
      rec.flush();
