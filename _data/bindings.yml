- slug: php
  name: PHP
  family: native
  mechanism: PHP FFI (FFI::cdef)
  mechanism_note: The Composer package declares the C ABI of libservirtium_vcr with
    FFI::cdef and presents a fluent builder (Vcr::playback / Vcr::record ... ->start()).
    No Servirtium logic is reimplemented in PHP.
  toolchain: 'PHP 8.2+ with ext-ffi (composer.json: php >=8.2, ext-ffi) and Composer.
    Checked on PHP 8.5.13, Composer 2. (php/docs/building.md says 8.4+ for developing
    the binding itself.)'
  dist: vendor
  dist_summary: Not on Packagist. Composer path repository onto a checkout of the
    tag, plus the release native library
  library_lookup: Looks for php/native/libservirtium_vcr.so (or .dylib; servirtium_vcr.dll
    on Windows) inside the package. Overridden by SERVIRTIUM_VCR_LIB (absolute path)
    or ->nativeLib($path) on the builder, or Vcr::playback($tape, $libPath).
  install:
  - text: 'There is no one-line composer require: composer.json lives in php/ of a
      monorepo, and Composer''s vcs repository type only reads a repository root.
      Use a path repository onto a checkout of the tag. First clone the tag (only
      php/ is used).'
    code: |
      VER=@TAG@
      git clone --depth 1 --branch $VER https://github.com/servirtium/servirtium-vcr.git vendor-src/servirtium-vcr
    code_lang: sh
  - text: Download the native library for your platform into that checkout's php/native/,
      verify its checksum, and give it the plain file name the loader wants.
    code: |
      REL=https://github.com/servirtium/servirtium-vcr/releases/download/$VER
      # Linux x86_64 shown; macOS arm64 is macos-arm64 + .dylib; see the release assets for others
      LIB=libservirtium_vcr-$VER-linux-x86_64.so
      N=vendor-src/servirtium-vcr/php/native
      mkdir -p $N
      curl -fsSL -o $N/$LIB $REL/$LIB
      curl -fsSL -o $N/$LIB.sha256 $REL/$LIB.sha256
      ( cd $N && { sha256sum -c $LIB.sha256 || shasum -a 256 -c $LIB.sha256; } )
      cp $N/$LIB $N/libservirtium_vcr.so
    code_lang: sh
  - text: Register the path repository and require the package (name servirtium/vcr,
      namespace Servirtium\).
    code: |
      composer config repositories.servirtium path vendor-src/servirtium-vcr/php
      composer require --dev servirtium/vcr:@dev
    code_lang: sh
  - text: Check it with a canned tape. The FFI extension must be enabled; on distros
      that ship it as a module php.ini does not load (Arch), add -d extension=ffi.
    code: |
      mkdir -p tapes
      curl -fsSL -o tapes/single_get.md https://raw.githubusercontent.com/servirtium/servirtium-vcr/$VER/php/example/tapes/single_get.md
      php -d ffi.enable=1 -r 'require "vendor/autoload.php";
        $v = Servirtium\Vcr::playback("tapes/single_get.md")->port(0)->start();
        echo file_get_contents($v->baseUrl()."/ok"), "\n"; $v->stop();'   # -> ok-body
    code_lang: sh
  record: |
    use Servirtium\Vcr;
    use Servirtium\VcrOutcome;

    $vcr = Vcr::record('tapes/climate_api.md', 'https://climatedataapi.worldbank.org')
        ->port(0)->start();
    try {
        // point the SUT at $vcr->baseUrl() ...
        file_get_contents($vcr->baseUrl() . '/api/v1/countries');
        assert($vcr->lastKind() === VcrOutcome::Ok);
        $vcr->commit();            // writes the tape; stop() without commit()/discard() writes nothing and throws
    } catch (\Throwable $e) {
        $vcr->discard();           // drop the recording, no tape written
        throw $e;
    }
  playback: |
    use Servirtium\Vcr;
    use Servirtium\VcrOutcome;

    $vcr = Vcr::playback('tapes/climate_api.md')->port(0)->start();   // port 0 = OS-assigned
    try {
        // point the SUT at $vcr->baseUrl(), drive it ...
        $body = file_get_contents($vcr->baseUrl() . '/api/v1/countries');
        assert($vcr->lastKind() === VcrOutcome::Ok);
        $vcr->assertAllConsumed();
    } finally {
        $vcr->stop();
    }
  code_lang: php
  extras:
  - title: Redact a secret at commit time
    note: The live SUT still sees real bytes; only the written tape is scrubbed. VcrField
      is Path, ResponseBody, RequestHeaders, RequestBody or ResponseHeaders.
    code: |
      use Servirtium\VcrField;

      Vcr::record($tape, $upstream)
          ->redactHeader('Authorization')                 // request header, replaced by [REDACTED]
          ->redactQueryParam('password')
          ->redact(VcrField::ResponseBody, 'Bearer abc123', 'Bearer REDACTED')
          ->redactCredentials()                           // Authorization, cookies, common key headers
          ->start();
  - title: Volatile value that round-trips
    note: A {{placeholder}} rule makes a re-record byte-identical; on playback a recorded
      token matches any live value, and a response token must be bound with bind().
    code: |
      Vcr::playback($tape)
          ->volatileRule('response headers', 'Date: {{serverDate}}')
          ->bind('serverDate', gmdate('D, d M Y H:i:s') . ' GMT')
          ->start();
  - title: Strict headers and diagnostics
    note: Opt-in header comparison; a mismatch answers 599 and fills lastError().
    code: |
      $vcr = Vcr::playback($tape)->strictHeaders()->start();
      // ... drive the SUT ...
      if ($vcr->lastKind() !== VcrOutcome::Ok) { throw new \RuntimeException($vcr->lastError()); }
  tests:
  - php/tests/RecordTest.php
  - php/tests/PlaybackTest.php
  - php/tests/SecretsTest.php
  - php/tests/VolatileTest.php
  - php/example/consumer_example.php
  - php/.example.ae
  readme: php/README.md
  notes:
  - ext-ffi is a hard requirement. In the CLI ffi.enable=preload (the php.ini default)
    still allows FFI::cdef; under php-fpm or Apache set ffi.enable=1.
  - 'Keep the native library out of vendor/: composer install can wipe it. Do not
    set options.symlink=false unless the library is already in php/native/.'
  - Could not find a matching version of package servirtium/vcr means the path repository
    is not configured, or points at the repo root instead of its php/ subdirectory;
    a vcs repository cannot work.
  - A record that is stopped without commit() or discard() writes nothing and throws
    VcrException.
  - PHP HTTP clients add default request headers; under strictHeaders() record with
    the same client or drop them with removeHeader(VcrField::RequestHeaders, ...).
  verified: 'On cachyos (linux-x86_64, PHP 8.5.13, Composer 2): followed the Getting
    it steps verbatim (release tag clone, release .so with sha256 check, composer
    path repo + require --dev servirtium/vcr:@dev, -d extension=ffi because Arch does
    not load FFI by default) and the check one-liner printed ok-body. Also ran the
    record snippet (with a redact() rule) against a local upstream: commit() wrote
    the tape, it replayed with VcrOutcome::Ok and assertAllConsumed(); stop() without
    commit() threw and wrote no file; volatileRule()+bind() accepted on playback.
    strictHeaders extra and redactHeader/redactQueryParam/redactCredentials names
    checked against src/RecordBuilder.php only, not run.'
