        sv_str base = sv_base_url(rec);
        /* ... point the system-under-test at base.ptr and drive it ... */
        sv_free(base);

        /* Commit: writes the tape. "" means OK, else the reason. */
        e = sv_close_and_flush(rec, NULL);
        if (e.len) { fprintf(stderr, "flush: %s\n", e.ptr); sv_free(e); return 1; }
