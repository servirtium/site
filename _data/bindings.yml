- slug: nim
  name: Nim
  family: native
  mechanism: "{.importc.} + {.passL.} link at compile time"
  mechanism_note: src/servirtium/native.nim declares the aether_vcr_embed_* ABI with
    importc/cdecl and links libservirtium_vcr when nim c runs, with its directory
    baked in as an rpath.
  toolchain: Nim 2.x and a C compiler (verified with Nim 2.4.2; the README states
    no minimum). --threads:on only if your own code uses threads.
  dist: vendor
  dist_summary: Vendor the source at the tag (--path) + link the release native library
  library_lookup: 'Linked at COMPILE time: SERVIRTIUM_VCR_LIB (read by staticExec
    when nim c runs) is the path of the file libservirtium_vcr.so/.dylib; its directory
    becomes -L and an rpath. Changing it later needs nimcache deleted or nim c -f.'
  install:
  - text: 'Fetch the native library for your OS/arch, verify its checksum, and give
      it the plain name the linker wants (-lservirtium_vcr). Windows: take the .dll
      asset by hand.'
    code: |
      TAG=@TAG@
      REL=https://github.com/servirtium/servirtium-vcr/releases/download/$TAG
      case "$(uname -s)" in
        Linux)   OS=linux;   EXT=so;    ldd --version 2>&1 | grep -qi musl && LIBC=-musl || LIBC= ;;
        Darwin)  OS=macos;   EXT=dylib; LIBC= ;;
        FreeBSD) OS=freebsd; EXT=so;    LIBC= ;;
      esac
      case "$(uname -m)" in x86_64|amd64) ARCH=x86_64 ;; arm64|aarch64) ARCH=arm64 ;; esac
      LIBDIR="$HOME/.servirtium-vcr/$TAG"; mkdir -p "$LIBDIR"
      LIB=libservirtium_vcr-$TAG-$OS-$ARCH$LIBC.$EXT
      curl -fsSL -o "$LIBDIR/$LIB" "$REL/$LIB"
      curl -fsSL -o "$LIBDIR/$LIB.sha256" "$REL/$LIB.sha256"
      ( cd "$LIBDIR" && { sha256sum -c "$LIB.sha256" || shasum -a 256 -c "$LIB.sha256"; } )
      cp "$LIBDIR/$LIB" "$LIBDIR/libservirtium_vcr.$EXT"
    code_lang: sh
  - text: 'macOS only: the release .dylib carries a CI build path as its install name,
      so a binary linked against it fails to start with ''Library not loaded: /home/runner/...''.
      Rewrite the install name and re-sign before compiling anything against it.'
    code: |
      install_name_tool -id @rpath/libservirtium_vcr.dylib "$LIBDIR/libservirtium_vcr.dylib"
      codesign -f -s - "$LIBDIR/libservirtium_vcr.dylib"
    code_lang: sh
  - text: Take the Nim sources of the same tag into your project and put them on the
      compiler's path.
    code: |
      git clone --depth 1 --branch @TAG@ https://github.com/servirtium/servirtium-vcr.git third_party/servirtium-vcr
      # nim c ... --path:third_party/servirtium-vcr/nim/src   (or switch("path", ...) in config.nims)
    code_lang: sh
  - text: 'Check it: compile and replay the canonical tape (expect ''ok-body Ok'').
      SERVIRTIUM_VCR_LIB must be set when nim c runs, not at run time.'
    code: |
      export SERVIRTIUM_VCR_LIB="$LIBDIR/libservirtium_vcr.$EXT"
      mkdir -p tapes
      curl -fsSL -o tapes/single_get.md https://raw.githubusercontent.com/servirtium/servirtium-vcr/@TAG@/nim/example/tapes/single_get.md
      cat > servirtium_check.nim <<'NIM'
      import servirtium
      import std/httpclient
      let vcr = playback("tapes/single_get.md")
      doAssert vcr.start()
      echo newHttpClient().getContent(vcr.baseUrl() & "/ok"), " ", vcr.lastKind()
      vcr.close()
      NIM
      nim c -r --hints:off --path:third_party/servirtium-vcr/nim/src servirtium_check.nim
    code_lang: sh
  record: |
    import servirtium
    import std/httpclient

    let srv = record("tapes/climate_api.md", "https://climatedataapi.worldbank.org")
    doAssert srv.start()
    # ... drive your SUT against srv.baseUrl() ...
    discard newHttpClient().getContent(srv.baseUrl() & "/api/v1/countries")
    srv.commit()      # the only way a recording becomes a tape
  playback: |
    import servirtium
    import std/httpclient

    let srv = playback("tapes/climate_api.md")   # port 0 = OS-assigned
    doAssert srv.start()
    defer: srv.close()

    let body = newHttpClient().getContent(srv.baseUrl() & "/api/v1/countries")
    doAssert srv.lastKind() == Ok                 # optional: assert a clean match
  code_lang: nim
  extras:
  - title: Discard the recording when the test fails
    note: close on a recording that was neither committed nor discarded raises VcrError
      and writes nothing; discardRecording drops it deliberately.
    code: |
      let srv = record(tape, upstream)
      doAssert srv.start()
      try:
        # ... drive the SUT, assert on it ...
        srv.commit()
      except CatchableError:
        srv.discardRecording()
        raise
  - title: Redact credentials
    note: redactCredentials scrubs the standard credential headers from the tape;
      redactHeader, redactQueryParam and redactJsonField cover named ones.
    code: |
      let srv = record(tape, upstream)
      srv.redactCredentials()
      srv.redactJsonField("secretKey")
      doAssert srv.start()
  - title: Volatile values and drift detection
    note: Rules tokenise values that change on every run so a re-record is byte-identical;
      failIfChanged then makes commit raise only on a real upstream change.
    code: |
      let srv = record(tape, upstream)
      srv.volatileRule("response headers", "Date: {{serverDate}}")
      srv.volatileRule("body", "(?<id>[0-9a-f]{32})", "regex")
      srv.failIfChanged()
      doAssert srv.start()
      # ... drive SUT ...
      srv.commit()   # raises VcrError on drift (the fresh tape is still written)
  tests:
  - nim/tests/playback_test.nim
  - nim/tests/record_test.nim
  - nim/tests/mutation_test.nim
  - nim/tests/volatile_test.nim
  - nim/example/consumer_example.nim
  - nim/example/tapes/single_get.md
  - nim/.example.ae
  readme: nim/README.md
  notes:
  - 'The library is linked, not dlopen-ed: use the same tag for source and library
    or the link fails with undefined reference to aether_vcr_embed_...'
  - 'The binary records the library''s directory as an rpath: do not delete ~/.servirtium-vcr/<tag>
    while binaries built against it are in use.'
  - The library file must be named exactly libservirtium_vcr.so/.dylib; SERVIRTIUM_VCR_LIB
    must point at the FILE, not the directory.
  - Use the -musl asset on Alpine.
  verified: 'Ran on cachyos (Linux x86_64, glibc, Nim 2.4.2) with the release libservirtium_vcr-@TAG@-linux-x86_64.so
    (sha256 checked) and a vendored clone of the tag via --path: playback of single_get.md
    (ok-body, Ok), record against a local python http.server then commit() then replay
    (hello-upstream, Ok), discardRecording leaves no tape, close() without commit
    raises VcrError and writes nothing, redactCredentials in the record. The volatile/failIfChanged
    extra is from docs/usage.md and not run. macOS not run for Nim (no toolchain on
    the Mac); the macOS install-name problem was reproduced with the Lua, Zig builds
    against the same dylib on macOS arm64.'
