    from the release
  library_lookup: 'Linked at build time: -L<dir> -lservirtium_vcr with an rpath to
    <dir>. <dir> must hold a file named exactly libservirtium_vcr.so / .dylib (the
    release asset name carries tag/os/arch, so copy it to the plain name). On macOS
    the release dylib carries a CI install name, so rewrite it (see the install steps).'
  install:
  - text: Fetch the native library for your OS/arch from the release, verify its checksum,
      and copy it to the plain name the linker wants (this is the README's step 1,
      collapsed; Linux x86_64 shown).
    code: |
      TAG=@TAG@
      REL=https://github.com/servirtium/servirtium-vcr/releases/download/$TAG
      LIBDIR="$HOME/.servirtium-vcr/$TAG"; mkdir -p "$LIBDIR"
      LIB=libservirtium_vcr-$TAG-linux-x86_64.so      # macos-arm64.dylib, linux-arm64-musl.so, freebsd-x86_64.so, ...
