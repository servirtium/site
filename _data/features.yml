# Feature inventory. Drives /features/ and llms-full.txt.
- slug: recording-rules-footer
  title: Recording-rules footer
  group: Recording
  summary: An opt-in table at the end of a tape listing what the test left out or
    rewrote, so a reader knows what the recording does not show.
  body: |
    A recording is "what was sent" unless the test says otherwise. Once a test removes headers, redacts values or declares volatile ones, a reader of the tape cannot tell what is missing. The **recording-rules footer** says so: a `## [Recording rules]` section after the last interaction, rendered by GitHub as a table.

    **What it lists.** Each rule is a row: removed headers (grouped under the preset's name when a preset registered them), redactions, volatile-value rules, whole-tape collapses. The **Interactions** column shows which interactions each rule touched; `none` flags a rule that matched nothing (often a typo). A literal redaction's pattern is **never printed**, because it is often the secret itself. Header, query and JSON-key redactions print the name.

    **Behaviour.**

    - **Opt-in, off by default**, so existing suites' committed tapes do not change under them.
    - Playback ignores it by design: the parser stops at the heading before it looks for interactions, so nothing in a footer can become an interaction.
    - `redact_whole_tape_described` lets a rule show a description in place of its pattern (useful when the pattern holds a per-run value).
    - The pre-recorded service tapes under `pre-recorded/` always turn it on.

    A footer from a recording that removed the `Server` header, used `strict_ignore_common_headers` and collapsed timestamps (verified on the release macOS arm64 library, through the C ABI):

    ```markdown
    ## [Recording rules]

    | Rule | Applies to | Matching | Written as | Interactions |
    |---|---|---|---|---|
    | removed (common client headers) | request headers | `User-Agent`, `Accept`, `Accept-Encoding`, `Connection` | (left out) | 0 |
    | removed | response headers | `Server` | (left out) | 0 |
    | collapsed | whole recording | *timestamps* | `2000-01-01T00:00:00Z` | 0 |
    ```

    **Bindings: only Janet wraps it so far.** In Janet it is the record option `:rules-footer true` (or `servirtium/set-rules-footer`). Every other binding needs the C ABI call (or has no public method yet).

    C ABI: `aether_vcr_embed_set_rules_footer(h, 1)`.
  docs:
  - AGENTS.md
  tests:
  - core_tests/test_vcr_rules_footer.ae
  - janet/test/playback.janet
  bindings: 'Janet only (set-rules-footer / :rules-footer). Other bindings: C ABI
    only'
- slug: record-and-playback
  title: Record and playback modes
  group: Recording
  summary: Playback replays a tape with no network; record forwards to a live upstream
    and captures the exchange; each server has its own handle and port.
  body: |
    Servirtium has two modes. **Playback** serves a committed tape: no network, no upstream, the same answers every run. **Record** is a transparent proxy: it forwards each request to the real upstream, hands the live response back to your client, and captures the exchange for a tape.

    **Behaviour.**

    - You open a VCR (playback with a tape path; record with a tape path and an upstream base URL), configure it, start it, and read its `base_url`. Point the client under test at that URL.
    - Playback matches in recorded order and consumes each interaction; opt-in options (`match_multiple`, `match_header`, `strict_headers`, `playback_range`, `pretty_json`/`pretty_xml`) refine that. A mismatch answers with a diagnostic and records an outcome you can assert on (`last_kind` is `Ok` when all is well).
    - Record mode pairs each client connection with its own upstream connection, so connection-bound authentication such as NTLM records correctly.
    - Every VCR is **its own server with its own handle**: any number can run in one process, one per port, and nothing about one is kept outside its handle. Rules registered on one never leak into another.
    - Port `0` asks the OS for a free port; the real one is available after start (`port`, `base_url`). This is the default in most bindings and avoids racing other processes for a fixed port.
    - A failed open is a dead handle that carries its reason; the binding raises it.

    ```python
    import servirtium

    with servirtium.record("tapes/greeting.md", "http://127.0.0.1:8000").port(0).start() as rec:
        fetch(rec.base_url + "/greeting")       # forwarded, answered live, captured
        rec.commit()

    with servirtium.playback("tapes/greeting.md").port(0).start() as vcr:
        body = fetch(vcr.base_url + "/greeting")  # served from the tape, upstream not needed
        assert vcr.last_kind is servirtium.Outcome.OK
        vcr.assert_all_consumed()
    ```

    C ABI: `aether_vcr_embed_open_playback`, `_open_playback_url` (tape fetched over HTTP), `_open_record`, `_open_error`, `_start`, `_port`, `_base_url`, `_stop`, `_destroy`.
  docs:
  - README.md
  - python/docs/usage.md
  - release/notes/alpha.20.md
  tests:
  - python/test/test_record.py
  - python/test/test_playback.py
  - python/test/test_concurrent.py
  - core_tests/test_vcr_start_error.ae
  - core_tests/test_vcr_concurrent_config.ae
  bindings: every binding
- slug: drift-detection
  title: Drift detection
  group: Recording
  summary: Re-record against the live service and fail if the new tape differs from
    the committed one, so API changes show up as a git diff.
  body: |
    A tape is a claim about what a service did. **Drift detection** re-records and compares, so a real change in the service fails a test instead of silently making your tape stale. It is how a scheduled "does the tape still match reality?" job works.

    **Two variants.**

    - **`fail_if_changed`** (the Servirtium step-4 contract): commit writes the freshly recorded tape over the old one **and** raises if the bytes differ. A normal `git diff` then shows exactly what changed, and CI fails. When there is no tape yet, it just writes it.
    - **flush-or-check** (`stop_and_flush_or_check`): the non-destructive variant. It writes the new recording to `<tape>.actual` beside the committed tape and byte-compares, leaving the committed tape alone. A match deletes the `.actual` file; a mismatch leaves it for inspection.

    The error reads like "tape mismatch: expected=491 bytes, actual=483 bytes; updated tape written to ...". Volatile values (see that feature) are compared in their tokenized form, so values you declared volatile never count as drift while everything else does.

    Both the recorder and `fail_if_changed` need a commit: a record VCR closed without commit still writes nothing.

    ```python
    import servirtium

    # Nightly job: record against the live (or QA) service over the committed tape.
    with servirtium.record("tapes/cases.md", live_base_url).fail_if_changed().port(0).start() as rec:
        run_the_suite_against(rec.base_url)
        rec.commit()   # raises VcrError("tape mismatch: ...") if the service changed
    ```

    C ABI: `aether_vcr_embed_stop_and_flush_fail_if_changed` and `aether_vcr_embed_stop_and_flush_or_check`.

    Wrapping: `fail_if_changed` is wrapped by most bindings (Kotlin, Scala and Groovy inherit Java's `failIfChanged`; a search of the binding sources found no wrapper in Clojure, F#, Gleam or LFE). The `.actual` flush-or-check variant is wrapped by only a few bindings (Crystal's `flush_or_check`, Janet's `:or-check`); in the others it is in the native symbol table but has no public method.
  docs:
  - docs/volatile-values.md
  - python/docs/features.md
  tests:
  - core_tests/test_vcr_drift_fail.ae
  - core_tests/test_vcr_volatile_record.ae
  - python/test/test_record.py
  bindings: 'fail_if_changed: most bindings (not found in Clojure, F#, Gleam, LFE;
    JVM and CLR languages ride on Java/.NET). flush-or-check (.actual sibling): only
    Crystal and Janet expose it as a public call; elsewhere it is C ABI only'
- slug: rewrite-upstream-base
  title: Rewrite upstream base
  group: Recording
  summary: Keeps the client on the recorder when a service writes its own absolute
    URLs, and writes {{baseUrl}} on the tape so playback works on any port.
  body: |
    Some services write their own address into responses: a TFS location service, SharePoint, a HATEOAS API, a paging `nextLink`, a `Location` header. While recording, the client then follows that URL straight to the real service, **around the recorder**; those calls are never recorded, and a redaction cannot help, because it only changes the tape, not what the client receives.

    `rewrite_upstream_base` (record mode, **opt-in, off by default**) rewrites the traffic itself:

    - in the response the client receives (headers and body), the upstream's base URL becomes the recorder's, so the client keeps talking to the recorder;
    - in the request forwarded upstream, the recorder's base URL becomes the upstream's;
    - on the tape, both become `{{baseUrl}}`, which playback fills from the live request, on any port.

    The base that is rewritten is the upstream base the recording was opened with, without a trailing slash, path included. Open the recording with the base URL the service itself writes (same host name and port). An address outside that base, or a longer authority that merely starts with it, is left alone. A gzipped response is rewritten after decoding and sent to the client decoded; a binary body is never touched; a rewritten body's recorded `Content-Length` follows it.

    ```python
    import servirtium

    with servirtium.record("tapes/items.md", upstream).rewrite_upstream_base().port(0).start() as rec:
        page = fetch(rec.base_url + "/items")    # nextLink points at rec.base_url, not upstream
        rec.commit()                              # the tape holds {{baseUrl}}/items?page=2

    with servirtium.playback("tapes/items.md").port(0).start() as vcr:
        page = fetch(vcr.base_url + "/items")    # nextLink points at THIS port
    ```

    I recorded an upstream whose body was `{"items": [], "nextLink": "<upstream>/items?page=2"}`: the client saw the recorder's address, the tape held `{{baseUrl}}/items?page=2`, and a playback on a different port returned that port's address.

    C ABI: `aether_vcr_embed_set_rewrite_upstream_base(h, 1)` and `aether_vcr_embed_get_rewrite_upstream_base(h)`.
  docs:
  - docs/vcr-address.md
  - release/notes/alpha.20.md
  tests:
  - core_tests/test_vcr_rewrite_upstream_base.ae
  - core_tests/origin_fixture.ae
  - core_tests/test_vcr_self_address.ae
  - python/test/test_record.py
  - dotnet/Servirtium.Vcr.Tests/RewriteUpstreamBaseTests.cs
  bindings: every binding
- slug: forward-host
  title: Forward host
  group: Recording
  summary: Record mode can send the upstream the Host header the client sent, for
    services that check URLs against the Host they were addressed on.
  body: |
    By default the recorder talks to the upstream under the upstream's own authority, which is what a name-based virtual host wants. A few services behave differently: Azurite, for example, accepts a copy source only when its host matches the `Host` the request was sent to. For those, `forward_host` makes the recorder send the upstream the **client's** `Host` header (the recorder's own `127.0.0.1:<port>`), like a Host-preserving reverse proxy.

    **Behaviour.**

    - Record mode only; **opt-in, off by default**.
    - The recorded request headers hold what the client sent, as always; this changes only what the upstream sees.
    - `Expect` is never forwarded regardless: the recorder holds the whole body, so there is no use for `100-continue`.

    **Bindings: .NET only so far.** TODO.md lists the toggle as not yet wrapped by the other bindings; they need a `forward_host()` on the record builder, the same shape as `match_multiple()`. Until then another language can only reach it through the C ABI.

    ```csharp
    using Servirtium.Vcr;

    using VcrServer rec = Vcr.Record(tapePath, "http://127.0.0.1:10000")
        .Port(0)
        .ForwardHost()          // the upstream now sees Host: 127.0.0.1:<recorder port>
        .Start();
    // ... drive the SDK under test at rec.BaseUrl ...
    rec.Commit();
    ```

    I checked the behaviour at the C ABI against the release macOS arm64 library, with a local upstream that records the `Host` it receives: with `set_forward_host(h, 1)` the upstream saw the recorder's host and port, not its own. The .NET snippet mirrors `ForwardHostTests` and was not run here (no .NET SDK on this machine).

    C ABI: `aether_vcr_embed_set_forward_host(h, on)`.
  docs:
  - TODO.md
  - AGENTS.md
  tests:
  - core_tests/test_vcr_forward_host_and_expect.ae
  - dotnet/Servirtium.Vcr.Tests/ForwardHostTests.cs
  bindings: ".NET only (RecordBuilder.ForwardHost). Every other binding: C ABI only
    until a forward_host() toggle is added (TODO.md)"
- slug: upstream-ca-file
  title: Upstream CA and TLS
  group: Recording
  summary: Verify an https upstream against your own CA file while recording, and
    serve the VCR itself over https (TLS 1.3) from a PEM certificate and key.
  body: |
    Two separate TLS needs, both opt-in.

    **Recording against an https upstream with its own CA.** Some services generate a private CA (Elasticsearch 8 does). `upstream_cafile(path)` makes the recorder verify the upstream's certificate against that PEM file instead of the system trust store. Verification and hostname checks stay **on**; this is connection-level only and nothing about it reaches the tape. An empty path is an error. Record mode only.

    **Serving https from the VCR.** Some client libraries refuse plain `http://` to anything that is not trusted. `tls(cert_path, key_path)` makes the VCR serve `https://` from PEM files; `tls_from_pem(cert_pem, key_pem)` takes the PEM text in memory so no private key touches disk. The server is pure Aether TLS 1.3 with no OpenSSL dependency, so it works on every release platform. It accepts ECDSA P-256/P-384/P-521, Ed25519 and RSA 2048-16384 keys; an unusable or mismatched pair is refused at set time. `base_url` then starts with `https://` and `last_tls_protocol` reports `TLSv1.3`.

    Servirtium records HTTP messages, not connections, so TLS never appears on the tape: playback serves its own certificate, which your test trusts.

    ```python
    import servirtium

    # Record from an upstream with a private CA (Python spells it upstream_cafile).
    with servirtium.record("tapes/es.md", "https://localhost:9200") \
            .upstream_cafile("certs/http_ca.crt").port(0).start() as rec:
        search(rec.base_url)
        rec.commit()

    # Serve the tape over https; trust your own certificate in the client.
    with servirtium.playback("tapes/es.md").tls("certs/server.pem", "certs/server.key") \
            .port(0).start() as vcr:
        assert vcr.base_url.startswith("https://")
        assert vcr.last_tls_protocol == "TLSv1.3"
    ```

    I ran the listener half on the release macOS arm64 library with a self-signed ECDSA P-256 certificate (both `tls` and `tls_from_pem` answered over TLSv1.3). The `upstream_cafile` call is checked by `core_tests/tls_probe.ae` and not run from Python here.

    C ABI: `aether_vcr_embed_set_upstream_cafile`, `aether_vcr_embed_set_tls`, `aether_vcr_embed_set_tls_pem`, `aether_vcr_embed_last_tls_protocol`.
  docs:
  - AGENTS.md
  - python/docs/usage.md
  tests:
  - core_tests/tls_probe.ae
  - dotnet/Servirtium.Vcr.Tests/TlsTests.cs
  - python/test/test_playback.py
  bindings: 'upstream_cafile: wrapped by most bindings (Python, .NET, Rust, Go, Dart,
    Nim, Zig, Elixir, Erlang, Gleam, LFE, Clojure and others; check the binding''s
    features.md). tls / tls_from_pem: Dart, .NET, Elixir, Erlang, Go, Haskell, Janet,
    Java, JavaScript, Lua, Nim, Pharo, PHP, Python, Ruby, Rust, Zig'
- slug: license-notice
  title: License notice
  group: Recording
  summary: Put the licence or terms of the recorded service at the top of every tape,
    so anyone reading or replaying it sees them.
  body: |
    A tape holds a real service's responses. If that service has terms (a "no reverse engineering" clause, a data licence), the tape should carry them. `add_license_notice(text)` writes your text under a `## LICENSE NOTICE` heading at the top of every tape the recording produces, before `## Interaction 0`.

    **Behaviour.**

    - **Opt-in**, record mode. Servirtium writes the text exactly as given: you supply any line breaks.
    - Calling it more than once adds paragraphs, in call order.
    - Playback ignores the section (tapes are parsed from the first `## Interaction ` heading), which is why no line of the notice may start with `## Interaction ` or `## [Recording rules]`. The call is refused with an error if one does. Empty text is also refused.
    - It sits before any `## Volatile values` block.

    ```python
    import servirtium

    with servirtium.record("tapes/example.md", upstream) \
            .add_license_notice("Recorded from the Example API.\nTerms: https://example.com/terms") \
            .port(0).start() as rec:
        call_the_service(rec.base_url)
        rec.commit()
    ```

    The first lines of the resulting tape (verified on the release macOS arm64 library):

    ```markdown
    ## LICENSE NOTICE

    Recorded from the Example API.
    Terms: https://example.com/terms

    ## Interaction 0: GET /items2
    ```

    A notice containing a line `## Interaction 9: x` is refused when the recorder is started: "add_license_notice: a line may not start with '## Interaction ' or '## [Recording rules]' (playback reads those as tape structure)".

    C ABI: `aether_vcr_embed_add_license_notice(h, text)`.
  docs:
  - AGENTS.md
  tests:
  - core_tests/test_vcr_license_notice.ae
  - python/test/test_record.py
  bindings: every binding
- slug: commit-discard
  title: Commit and discard
  group: Recording
  summary: A recording becomes a tape only when you commit it; closing a record VCR
    without commit or discard writes nothing and raises.
  body: |
    A recording is only as trustworthy as the test that produced it. A test that fails half-way, or forgets to finish, must never leave behind a tape that later replays as the truth. So in record mode the tape is written by exactly one thing: an explicit **commit**. The alternative is **discard**, which stops the server and drops the in-memory recording.

    **Behaviour.**

    - `commit()` stops the server and writes the tape (or, with `fail_if_changed`, writes it and raises if it differs; see drift detection).
    - `discard()` stops the server and writes nothing. Calling `close()` afterwards is quiet.
    - Closing, disposing or dropping a record VCR that was neither committed nor discarded writes **no tape and raises** (Python `VcrError`, .NET and Java `VcrException`, a returned error in Go, ...) with: "record VCR closed without commit or discard, so no tape was written".
    - The scoped forms (`with` in Python, `using` in C#, the block forms in Ruby and Crystal, ...) discard the recording when the block raises, so the original failure is not hidden.
    - Playback is unaffected: closing a playback VCR just stops it.

    Some bindings spell commit differently (`flush-tape` in Janet, `sv_close_and_flush` in C, `flush()` in C++).

    ```python
    import servirtium

    with servirtium.record("tapes/greeting.md", "http://127.0.0.1:8000").port(0).start() as rec:
        call_the_service(rec.base_url)      # your client, pointed at the recorder
        rec.commit()                        # the tape is written here and only here

    # A failing block discards; an uncommitted block raises VcrError:
    #   record VCR closed without commit or discard, so no tape was written
    with servirtium.record("tapes/other.md", upstream).port(0).start() as rec:
        call_the_service(rec.base_url)
        rec.discard()                       # explicit: nothing written, no error
    ```

    C ABI: `aether_vcr_embed_stop_and_flush`, `aether_vcr_embed_discard`, `aether_vcr_embed_close` (returns "" or the message).
  docs:
  - release/notes/alpha.20.md
  - python/docs/usage.md
  tests:
  - core_tests/test_vcr_close_requires_commit.ae
  - python/test/test_record.py
  - dotnet/Servirtium.Vcr.Tests/RecordTests.cs
  bindings: 'every binding (spelling differs: commit/Commit, flush-tape in Janet,
    sv_close_and_flush in C, flush() in C++)'
- slug: matching-and-outcomes
  title: Matching and outcomes
  group: Playback and matching
  summary: Strict method and path matching after RFC 3986 normalization, request headers
    and body compared when the tape records them, opt-in semantic and strict modes,
    and a numbered outcome for every request.
  body: |
    Playback is a real HTTP server that answers each request from the tape. What it checks, and what it
    reports when a request does not fit, is the same in every binding because it is all in the core.

    **What is compared**

    - **Method and path, always, strictly.** The path and query are compared after RFC 3986 normalization:
      hex escapes are upper-cased, escapes of unreserved characters are decoded, and `%20` equals `+` in the
      query only. So a tape holding `{{uuid-2}}` matches a client's `%7B%7Buuid-2%7D%7D`. A reserved delimiter
      that is escaped (`%2F`, `%26`, `%25`) stays different from the bare character.
    - **Request headers, when the tape's request-headers block is not empty.** Names are case-insensitive,
      values are exact. `Host`, the hop-by-hop headers and `Accept-Encoding` are never compared.
    - **Request body, when the tape's body is not empty.** Byte-exact by default; `pretty_json` and
      `pretty_xml` on the playback builder opt in to semantic comparison (key order and whitespace ignored,
      a non-JSON body still byte-exact).
    - **Strict headers (opt-in).** `strict_headers` also fails a live header the tape never recorded, which is
      how a tape with an empty headers block stops accepting any client. Use `remove_header` or a header preset
      for the headers your HTTP client adds on its own.

    **Outcomes.** A mismatch answers `599` with a short message and sets `last_kind`, `last_index` and
    `last_error`: `Ok=0, PathOrMethodDiff=1, HeaderMissing=2, HeaderValueDiff=3, HeaderUnexpected=4,
    TapeExhausted=5, BodyDiff=6, RecordError=7`. A test asserts `Ok` after the call it cares about.
    Ordered playback consumes one interaction per request.

    ```python
    import servirtium
    from servirtium import Outcome

    with servirtium.playback("tapes/ab.md").port(0).start() as vcr:   # tape: GET /a, then GET /b
        status = call(vcr.base_url + "/b")      # your client; the tape expects /a first
        assert status == 599
        assert vcr.last_kind is Outcome.PATH_OR_METHOD_DIFF and vcr.last_index == 0
        print(vcr.last_error)                   # a report: "first difference: path ... - /a  + /b"
    ```

    Verified output of that scenario: `tape mismatch at interaction 0: expected GET /a, got GET /b`.

    C ABI: `aether_vcr_embed_last_kind`, `_last_index`, `_last_error`, `_set_strict_headers`, `_set_pretty_json`.
  docs:
  - docs/replay-diagnostics.md
  - README.md
  tests:
  - core_tests/test_vcr_strict_match.ae
  - core_tests/test_vcr_strict_match_body.ae
  - core_tests/test_vcr_strict_ignore_headers.ae
  - core_tests/test_vcr_path_encoding.ae
  - core_tests/test_vcr_header_name_case.ae
  - core_tests/test_vcr_json_body_match.ae
  - core_tests/test_vcr_xml_body_match.ae
  bindings: every binding
- slug: match-multiple-and-match-header
  title: Match-multiple and match-header
  group: Playback and matching
  summary: Opt-in reusable, order-independent playback, and matching on one named
    request header instead of the whole header block.
  body: |
    Two opt-in matchers for tests whose requests do not arrive in tape order, or whose clients send headers
    that never match a recording.

    **`match_multiple`.** Default playback is strictly ordered and consuming: the next request must be the
    next interaction, and each is used once. With `match_multiple` the VCR searches all interactions (only
    those in the playback range, if one is set) for one that fits and replays it **without consuming it**.
    Polling, retries, a client that fires its lookups in any order, and the same request twice all work. The
    CLI's `servirtium serve` turns it on by default for the same reason. `assert_all_consumed` still works: it
    fails while any interaction has never been matched, and passes once each has been used at least once
    (verified: after `/a` alone it named `[1] GET /b`; after `/b` too it passed).

    A miss is not reported against interaction 0. The core ranks the candidates (same method and path first,
    then the most similar body, ties to the lowest index) and the mismatch report is about the closest one
    (see "Replay diagnostics").

    **`match_header(name)`.** Require that request header's live value to equal the recorded one, and nothing
    else from the header block. Registering one suppresses the automatic whole-block header match unless
    `strict_headers` is on, so it is surgical: a recording that carries `Accept`, `User-Agent` and
    `X-Api-Version: 2` replays for any client that sends `X-Api-Version: 2`. It can be called more than once.

    ```python
    import servirtium

    # tape: GET /data with recorded headers Accept, User-Agent, X-Api-Version: 2
    with servirtium.playback("tapes/by_header.md").match_header("X-Api-Version").port(0).start() as vcr:
        ok = call(vcr.base_url + "/data", headers={"X-Api-Version": "2"})   # 200
        no = call(vcr.base_url + "/data", headers={"X-Api-Version": "9"})   # 599, HeaderValueDiff
    ```

    Verified: with `match_multiple`, `/b` then `/a` then `/a` again all answered 200 and an unknown path
    answered 599; with `match_header`, version 2 answered 200 and version 9 `HeaderValueDiff`.

    C ABI: `aether_vcr_embed_set_match_multiple`, `_match_header`, `_clear_match_headers`.
  docs:
  - docs/replay-diagnostics.md
  tests:
  - core_tests/test_vcr_match_multiple.ae
  - core_tests/test_vcr_by_header.ae
  - core_tests/test_vcr_closest_candidate.ae
  bindings: Wrapped by nearly every binding (python, rust, java and the JVM four,
    ruby, javascript, php, dart, go, nim, zig, lua, haskell, elixir, erlang, dotnet,
    c, cpp, crystal, d, julia, janet, swift, pharo). In the Gleam and LFE sources
    I found playback_range wrapped but no match_multiple or match_header wrapper (the
    shared NIF exports both); check the binding README before relying on it there.
- slug: playback-range
  title: Playback range
  group: Playback and matching
  summary: Replay only interactions from..to of a tape, so one recorded journey serves
    many tests.
  body: |
    A browser or integration test records a whole journey once: log in, add to cart, open the card page, pay
    with the wrong CVC. Another test wants only "purchase rejected" and does not want to repeat the login.
    `playback_range(from, to)` replays only that slice of the same tape.

    - **Numbers are the tape's `## Interaction N` headings**, 0-based and inclusive; `to` below 0 means
      through the last one. They shift when the tape is re-recorded.
    - Set it after opening and before starting. A bad range (negative `from`, `to` before `from`, either
      past the last interaction) is refused, and checked again at start, which fails with the reason.
    - Ordered playback starts its cursor at `from`; `reset_cursor` returns to `from`; a request after `to`
      is `TapeExhausted`, "past the end of the playback range".
    - **Interactions outside the range are never served.** A request that would have matched one fails as
      `PathOrMethodDiff` and says so: "interaction 0 is outside the playback range 2-3 (expected interaction
      2: GET /step2)". No new outcome kind.
    - `match_multiple` searches only the range, and `assert_all_consumed` counts only the range.
      `tape_length` stays the whole tape.
    - **Playback only.** A record handle refuses a range, so a test that thinks it replays a slice can never
      overwrite the journey's tape with one.
    - **Values and credentials from skipped interactions.** A cart id first seen in skipped interactions is on
      the tape as a normalized token such as `{{uuid-1}}`, and the test, which never received it, sends it
      literally. With the credential preset (`redact_credentials`) on the playback handle, `Cookie` matches
      on presence, so a session cookie the test set itself passes.

    ```python
    import servirtium

    with servirtium.playback("tapes/journey.md").redact_credentials().playback_range(2, 3).port(0).start() as vcr:
        call(vcr.base_url + "/step2")        # interaction 2: served
        call(vcr.base_url + "/step3")        # interaction 3: served
        vcr.assert_all_consumed()            # counts only 2..3
    ```

    Verified: with a five-interaction tape and range 2..3, `/step2` and `/step3` answered 200,
    `/step0` answered 599 with the "outside the playback range 2-3" message, `/step4` was `TapeExhausted`,
    and a range starting at 9 was refused with "from (9) is past the tape's last interaction (4)".

    C ABI: `aether_vcr_embed_set_playback_range` (returns an error string the caller frees),
    `_clear_playback_range`, `_get_playback_range_from`, `_get_playback_range_to`.
  docs:
  - README.md
  tests:
  - core_tests/test_vcr_playback_range.ae
  bindings: Wrapped by every binding I checked (python, dotnet, javascript, c, cpp,
    crystal, d, julia, janet, swift, erlang, elixir, haskell, pharo, gleam, lfe, fsharp).
    The repository's pre-recorded recorder exposes it as replaying_part(suite, case,
    url, from, to).
- slug: replay-diagnostics
  title: Replay diagnostics
  group: Playback and matching
  summary: A side channel on the VCR handle that carries rich mismatch reports (closest
    candidate, first real difference, request-header section) to the test, independently
    of the HTTP client.
  body: |
    The HTTP response to a mismatched request stays short (`599` and one line), because the system under test
    may swallow it. The detail travels through the handle: the test reads it, or asserts on it, after
    exercising the system.

    **What a report holds.** The outcome name, the test coordinates, the tape and interaction index, the request,
    and:

    - `closest:` under `match_multiple`, the interaction the request was most plausibly meant for (same
      method and path first, then the body that shares the longest prefix and suffix, ties to the lowest
      index), with its tier and whether it was already used;
    - `first difference:` where the request and that interaction first really differ: `method`, `path`, a
      `header NAME`, or the request body, with an XML element path or JSON pointer and the byte offset, one
      masked line each side. Volatile-value tokens never count as differences;
    - `request headers: match`, or the first differing header, both sides in matching's canonical form;
    - for a `TapeExhausted` request, the request whole (headers and body) ready to be written into a tape.

    Credentials are masked (Authorization, Cookie, X-Api-Key, `password`/`token` query parameters and JSON
    keys, and values you `unredact`) before anything is cut out or printed.

    **Retrieval and test boundaries.** Events are retained across successful requests. `last_error` /
    `read_last_error(False)` read the latest; `diagnostics_json()` returns all as JSON (`closestCandidate`,
    `candidates`, `headersMatch`, `firstDifference`, ...); `assert_no_mismatches()` fails with all of them.
    `test_context(name, file, line)` marks a new test: it reports the previous test's unretrieved failures
    to stderr under the previous coordinates, clears them, and installs the new ones. Closing a handle
    reports any left over (`Servirtium: UNRETRIEVED REPLAY MISMATCH`), once.

    ```python
    import servirtium

    with servirtium.playback("tapes/users.md").port(0).start() as vcr:
        vcr.test_context("UsersTest.rejects_admin", "tests/test_users.py", 42)
        exercise_system_under_test(vcr.base_url)
        vcr.assert_no_mismatches()      # raises VcrError with the report
    ```

    Verified output (a request for `/zzz` against a tape expecting `GET /a`) began
    `Servirtium replay mismatch #1 (PathOrMethodDiff)`, then `test: UsersTest.rejects_admin`,
    `source: tests/test_users.py:42`, `tape: ...`, `interaction: 0`, `first difference: path, normalised byte 1`.

    C ABI: `aether_vcr_embed_last_error_ex`, `_diagnostics_json`, `_assert_no_mismatches`, `_test_context`.
  docs:
  - docs/replay-diagnostics.md
  tests:
  - core_tests/.diagnostics.ae
  - core_tests/diagnostics_tests.ae
  - core_tests/test_vcr_closest_candidate.ae
  - core_tests/test_vcr_closest_unit.ae
  - core_tests/test_vcr_request_headers_report.ae
  - core_tests/test_vcr_report_readability.ae
  bindings: every binding (names per binding are in the table in docs/replay-diagnostics.md;
    property-style bindings keep their consuming property and add a boolean read method)
- slug: vcr-address-placeholders
  title: The VCR's own address on a tape
  group: Playback and matching
  summary: "{{baseUrl}}, {{request.host}} and {{request.scheme}} stand for the VCR's
    address in both the recorded request and the recorded response, so a tape replays
    on any port."
  body: |
    A test hands its client the VCR's base URL, and with port 0 the port is different every run. A tape that
    holds the address literally replays only on that port. Three placeholders stand for it:

    | Placeholder | Filled with |
    |---|---|
    | `{{baseUrl}}` | scheme, `://` and the live request's `Host` (`http://127.0.0.1:54213`) |
    | `{{request.host}}` | the live request's `Host` |
    | `{{request.scheme}}` | `https` when the VCR serves TLS, else `http` |

    They are filled **on both sides**, from the request being answered:

    - **In a recorded response** (headers and body): a paging `nextLink`, a `Location` or a HATEOAS link points
      back at the VCR.
    - **In a recorded request** (path, headers, body) when playback compares it: a SOAP `<a:To>`, a callback
      URL or a `Referer` that carries the VCR's address matches on any port. It is not a wildcard: another
      address is still a mismatch, and the report shows the expectation filled in, so only the real
      difference shows.

    So the test needs to know nothing about the address before the VCR starts: start it on port 0, read
    `base_url`, give that to the client. `{{request.header.NAME}}` (the live request's `NAME` header) is
    filled in responses only.

    A hand-written tape can use the placeholders directly. A **recording** gets them from
    `rewrite_upstream_base` (record mode, opt-in, described under "Rewrite upstream base"): the upstream's own
    base URL in responses becomes the recorder's for the client, and both become `{{baseUrl}}` on the tape.

    ```python
    import servirtium

    # tape: POST /callback?to={{baseUrl}}/hook, body to={{baseUrl}}/hook,
    #       response body "ok at {{baseUrl}}/next on {{request.host}} via {{request.scheme}}"
    with servirtium.playback("tapes/callback.md").port(0).start() as vcr:
        b = vcr.base_url
        r = post(f"{b}/callback?to={b}/hook", body=f"to={b}/hook")
        # -> "ok at http://127.0.0.1:57732/next on 127.0.0.1:57732 via http"
        post(f"{b}/callback?to=http://other.example/hook", body="to=http://other.example/hook")  # 599
    ```

    Verified on a hand-written tape: the first call matched and was filled in; the call carrying another
    address was `PathOrMethodDiff`.
  docs:
  - docs/vcr-address.md
  tests:
  - core_tests/test_vcr_self_address.ae
  - core_tests/test_vcr_request_header_token.ae
  - core_tests/test_vcr_rewrite_upstream_base.ae
  - core_tests/origin_fixture.ae
  bindings: every binding (the placeholders are core; rewrite_upstream_base is on
    every binding's record builder, see docs/vcr-address.md for the per-binding call)
- slug: static-content-and-untaped
  title: Static content and untaped paths
  group: Playback and matching
  summary: Serve a path prefix from disk beside the tape, and answer incidental paths
    such as /favicon.ico with a bare 404 that never touches the tape.
  body: |
    Browser-driven suites (Selenium, Cypress, Playwright) fetch CSS, scripts, images and a favicon that have
    no business on a tape. Two small switches keep them off it.

    **`static_content(mount, dir)`.** Requests under `mount` are served from `dir` on disk, same origin as the
    tape's API paths, so there is no CORS noise and nothing from the assets is recorded or consumed. A path
    escaping the directory (`/assets/../etc/passwd`) is refused with 403, a missing file is 404, and a text
    file gets its content type. Configure it before starting the VCR.

    **`untaped(path)`.** An exact path (the query is stripped first, so `/favicon.ico` also covers
    `/favicon.ico?v=2`) gets a bare 404 from the VCR without touching the tape. On playback it does not
    advance the cursor or raise `TapeExhausted`; on record it is not forwarded upstream and not written.
    It is opt-in: any other unknown path after the tape is used up is still a real `TapeExhausted`.

    ```python
    import servirtium

    with (servirtium.playback("tapes/app.md")
          .static_content("/assets", "build/static")
          .untaped("/favicon.ico")
          .port(0).start()) as vcr:
        get(vcr.base_url + "/assets/app.js")     # from disk
        get(vcr.base_url + "/favicon.ico")       # 404, tape untouched
        get(vcr.base_url + "/api/users")         # from the tape
    ```

    Verified (Python, release library): `/assets/app.js` answered 200 with the file's bytes, a missing asset 404,
    `/favicon.ico` 404, and the tape's `/a` still answered from interaction 0 afterwards. In record mode with
    `untaped("/favicon.ico")` the favicon request answered 404 and the committed tape held only the real
    interactions.

    At record time you will usually also strip volatile browser request headers with `remove_header`, or a
    strict playback rejects a real browser's headers.

    C ABI: `aether_vcr_embed_static_content`, `_untaped`, `_clear_static_content`, `_clear_untaped`.
  docs:
  - python/docs/usage.md
  tests:
  - core_tests/test_vcr_static_content.ae
  - core_tests/test_vcr_static_content_cache.ae
  - core_tests/test_vcr_untaped.ae
  bindings: every binding
- slug: notes
  title: Notes on a tape
  group: Playback and matching
  summary: 'Attach a titled note to the next recorded interaction; it is written as
    a ## [Note] block that playback ignores.'
  body: |
    A note is documentation for the human reading the tape: why this interaction exists, which scenario step
    it belongs to, what a value means. It is **record-side only**. `note(title, body)` stages a note and the
    next recorded interaction picks it up; the tape then carries a `## [Note] <title>:` block between the
    interaction heading and its `###` sections. An interaction recorded with no staged note has none, and
    calling `note` twice in a row replaces the staged one (the last wins). Playback walks the `###` sections
    only, so a note is ignored and never matched.

    Notes are also what the Bruno converter uses to say where each interaction came from and which headers
    the collection would send (see "Bruno convert and import"), and the Azure harness uses one to carry the
    test's start time.

    A related but separate switch, `add_license_notice(text)`, writes plain text once at the top of the tape
    under `## LICENSE NOTICE`, before `## Interaction 0`, for the recorded service's licence terms. No line
    of it may start `## Interaction ` or `## [Recording rules]`.

    ```python
    import servirtium

    rb = (servirtium.record("tapes/login.md", "https://api.example.test")
          .note("Login", "Signs in as the demo user.\n")
          .add_license_notice("Recorded against Example Service 1.0.\nSee its licence, section 3."))
    with rb.port(0).start() as vcr:
        client_login(vcr.base_url)                  # interaction 0 carries the "Login" note
        vcr.note("Second", "set on the running server")
        client_next(vcr.base_url)                   # interaction 1 carries "Second"
        vcr.commit()                                # a recording is written only on commit
    ```

    The tape that this produced (verified, against a local upstream) began `## LICENSE NOTICE`, the two lines,
    then `## Interaction 0: GET /ok`, `## [Note] Login:`, the note text, and the `### Request headers ...`
    section; interaction 1 had `## [Note] Second:`.

    C ABI: `aether_vcr_embed_note`, `_add_license_notice`.
  docs:
  - python/docs/features.md
  - README.md
  tests:
  - core_tests/test_vcr_notes.ae
  - core_tests/test_vcr_license_notice.ae
  bindings: every binding
- slug: ntlm-and-negotiate
  title: NTLM and Negotiate
  group: Playback and matching
  summary: Record mode pairs each client connection with its own upstream connection,
    so NTLM and Negotiate handshakes record and replay; the pre-recorded/ntlm suite
    shows how.
  body: |
    NTLM authenticates a **connection**, not a request: a Type 1 message, a `401` carrying the Type 2
    challenge, then a Type 3 that must arrive on the same connection. A recorder that pools upstream
    connections by origin breaks that, so Servirtium's does not.

    **Record mode.** The recorder pairs each client connection with an upstream connection of its own (a
    pinned client pool per client connection, closed when the client's connection closes). This needs
    **Aether 0.939.0 or newer** in the engine, which every release from alpha.20 is built with. Through the
    recorder an NTLM handshake behaves as it does directly: one client's three legs reach the server on one
    connection, two clients interleaving handshakes each keep their own, a Type 3 on a new connection is
    refused as the server refuses it, and an authenticated upstream connection stays its client's.

    **What a tape holds.** Every leg as its own interaction: the anonymous `401` (when the client sends one),
    the Type 1 and its `401` with the Type 2, the Type 3 and the `200`. The first `401`'s `Negotiate` and
    `NTLM` challenges keep the server's order.

    **Playback.** A client's Type 3 differs on every run (its nonce, timestamp and NTLMv2 proof), so strict
    matching would stop at it. The credential preset is the rule: `redact_credentials()` on the record and the
    playback builder writes `Authorization: NTLM AUTHORIZATION_N` and matches on presence. No core change was
    needed. The cost: playback cannot check an NTLM response, so a wrong password replays as `200`, and a tape
    replays only for a client that takes the same legs (a client that pre-sends its Type 1 needs a tape with no
    anonymous leg). Calls after the handshake carry no credential at all, so a calls-only test replays the
    handshake tape's later interactions with `playback_range`.

    ```python
    import servirtium

    def player(tape):
        return (servirtium.playback(str(tape))
                .remove_header(servirtium.Field.REQUEST_HEADERS, "User-Agent")
                .remove_header(servirtium.Field.REQUEST_HEADERS, "Accept-Encoding")
                .redact_credentials())

    # the calls after the handshake (interactions 3 to 5), no login needed
    with player("tapes/calls_on_an_authenticated_connection_requests_ntlm.md").playback_range(3).start() as vcr:
        ...   # requests.Session().post(vcr.base_url + "/echo") ...
    ```

    That `player()` is the repository's own (`pre-recorded/ntlm/conftest.py`). The server there is our own
    pyspnego acceptor with a synthetic user, not IIS: record against your own service before trusting details.
    Negotiate's final `mechListMIC` is keyed by the recording's session key, so a client that checks it fails
    on replay; a playback `substitute` that removes that header line cures it.
  docs:
  - pre-recorded/ntlm/README.md
  - pre-recorded/README.md
  tests:
  - pre-recorded/ntlm/test_ntlm.py
  bindings: Core behaviour, so every binding gets the per-connection pairing in record
    mode; the suite itself drives the Python binding (4 Python clients). Replaying
    from another language needs the credential preset and the same legs, see the README's
    'Replaying from another language'. Not run by me (needs requests-ntlm, httpx and
    pyspnego); the README reports 39 passed and 1 xfailed on macOS arm64 and on cachyos,
    Aether 0.941.0, 2026-11-24.
- slug: dotnet-framework-48
  title: ".NET Framework 4.8"
  group: Playback and matching
  summary: 'The Servirtium.Vcr package targets net48 as well as net8.0: the Windows
    engine is copied for you, there is no 32-bit engine, and CreateClientHandler is
    not available.'
  body: |
    The release's `Servirtium.Vcr.@VER@.nupkg` carries `lib/net48/` beside `lib/net8.0/`, with the native
    engines inside under `runtimes/<rid>/native/` (Windows x64 and ARM64 are the ones .NET Framework uses). The
    feature came out of a .NET Framework 4.8 user's field report, and the package now covers the project shapes
    such a user has.

    **The engine reaches your output directory** in every usual shape:

    - SDK-style project with `PackageReference` and a `RuntimeIdentifier` (`win-x64`, `win-arm64`): NuGet copies it.
    - Without one, the package's `build/net48/Servirtium.Vcr.targets` copies it: with `PlatformTarget` `x64` or
      `ARM64` that engine; for AnyCPU (a test project, a library) both, under `runtimes\win-x64\native\` and
      `runtimes\win-arm64\native\`, and the binding loads the one for the process's architecture.
    - A project that references a project that has the `PackageReference`: `buildTransitive/net48/` does the same.
    - Classic `packages.config`: NuGet's install adds an import of the same targets file.

    **No 32-bit engine.** A build that makes a 32-bit process (`PlatformTarget` x86, `RuntimeIdentifier`
    `win-x86`, or an AnyCPU exe with `Prefer32Bit`, the classic console template's default) fails with
    **`SVCR001`** and says what to set. A RID that is neither x64 nor ARM64 fails with `SVCR002`. Set
    `<ServirtiumVcrCopyNative>false</ServirtiumVcrCopyNative>` to turn the copy and the check off, for example
    when `SERVIRTIUM_VCR_LIB` points at the engine.

    **`CreateClientHandler` is not available** on .NET Framework (it is built on `SocketsHttpHandler`); point the
    client at `BaseUrl` directly.

    ```xml
    <!-- your .csproj, the classic console template needs the two overrides -->
    <PropertyGroup>
      <TargetFramework>net48</TargetFramework>
      <PlatformTarget>x64</PlatformTarget>
      <Prefer32Bit>false</Prefer32Bit>
    </PropertyGroup>
    <ItemGroup>
      <PackageReference Include="Servirtium.Vcr" Version="@VER@" />
    </ItemGroup>
    ```

    Two practical points for HttpWebRequest and HttpClient on .NET Framework: HttpWebRequest sends
    `Expect: 100-continue` on every POST, which the `remove_transport_headers` preset leaves off the tape, and a
    `Cookie` header set by hand needs `UseCookies = false` or the handler replaces it.

    `dotnet/net48/check.sh` builds all of these project shapes from a packed `.nupkg` (on Linux), and runs them
    on Windows. Not run by me (no .NET SDK on this Mac); this entry is read from `dotnet/README.md`, the targets
    file and `check.sh`.
  docs:
  - dotnet/README.md
  - dotnet/docs/building.md
  - dotnet/Servirtium.Vcr/README.package.md
  tests:
  - dotnet/net48/check.sh
  - dotnet/Servirtium.Vcr.Tests/PlaybackTests.cs
  bindings: ".NET (and F#, which takes the same package). Windows x64 and ARM64 only."
- slug: header-presets
  title: Header presets and what a recording keeps
  group: Secrets and redaction
  summary: One-call opt-in rules for credentials, hop-by-hop headers, cloud tracing
    headers and client noise; a recording otherwise keeps every header as sent.
  body: |
    **What a recording keeps.** Record mode writes headers as sent: every request header the client sent (`Host`, `User-Agent`, `Accept`, `Connection`, `Content-Length`, ...) and every response header the service sent. There is no built-in drop list. The one hard-coded exception comes from Servirtium 1: a gzipped body is stored decoded, without that response's `Content-Encoding` and `Content-Length`. Anything else stays out only because the test removed or redacted it. Header names are case-insensitive everywhere; values are not.

    **Presets.** Most tests want the same few rules, so each preset is one call that registers ordinary rules. None is on by default, and the recording-rules footer lists each under its preset name.

    | Preset | Does |
    |---|---|
    | `redact_credentials` | `Authorization` and `Proxy-Authorization` keep their scheme (`Bearer AUTHORIZATION_1`); each cookie value in `Cookie`/`Set-Cookie` becomes `COOKIE_N`; `X-Api-Key`, `X-Auth-Token` become `API_KEY_N`, `AUTH_TOKEN_N` |
    | `redact_credential_header(name)` | one more header the same way (`X-Vault-Token: X_VAULT_TOKEN_1`) |
    | `remove_cloud_headers(vendor)` | a CDN's or load balancer's tracing/cache-status headers; vendors `aws`, `azure`, `cloudflare`, `fastly`, `gcp`, anything else is an error |
    | `remove_transport_headers` | `Host`, `Connection`, `Content-Length`, other hop-by-hop headers, the request's `Accept-Encoding`, and `Expect` (.NET Framework sends `Expect: 100-continue` on every POST) |
    | `strict_ignore_common_headers` | the request's `User-Agent`, `Accept`, `Accept-Encoding`, `Connection`, from the recording and from matching |
    | `ignore_volatile_headers` | `traceparent`, `tracestate`, `Request-Id`, `X-Request-Id`, `X-Correlation-Id`, `baggage` |

    Credentials are numbered per distinct value, in order of appearance, so a cookie a service set and the one the client sent back are both `COOKIE_1`. A value of 8 characters or more is also replaced wherever else it appears (for example echoed in a body). Playback matches credential headers on **presence, not value**, so register the preset on the playback VCR too. `remove_header(field, name)` removes any single header.

    ```python
    import servirtium

    with servirtium.record("tapes/me.md", upstream) \
            .remove_transport_headers().remove_cloud_headers("aws") \
            .redact_credentials().redact_credential_header("X-Vault-Token") \
            .ignore_volatile_headers().port(0).start() as rec:
        call_the_service(rec.base_url)   # sent Authorization: Bearer abc.def.ghi, a Cookie, X-Vault-Token
        rec.commit()                      # tape: Authorization: Bearer AUTHORIZATION_1, Cookie: sid=COOKIE_1, ...
    ```

    I ran this against a local upstream: the tape held `Authorization: Bearer AUTHORIZATION_1`, `Cookie: sid=COOKIE_1`, `X-Vault-Token: X_VAULT_TOKEN_1`, `Set-Cookie: sid=COOKIE_1; Path=/`, and no `Host`, `Connection`, `X-Cache` or `traceparent`; playback with the same presets accepted completely different live credential values.

    **Wrapping.** `redact_credentials`, `redact_credential_header`, `remove_cloud_headers` and `remove_transport_headers` are wrapped by every binding. `ignore_volatile_headers` and `remove_header` are wrapped by most (no wrapper found in Gleam and LFE for either, nor Clojure and F# for `ignore_volatile_headers`). `strict_ignore_common_headers` has a public method in C, C++, Crystal, D, Julia, Nim, Swift and Janet; Python, .NET, Java and several others have it only in the native symbol table, so use `remove_header` or `ignore_volatile_headers` there.

    C ABI: `aether_vcr_embed_redact_credentials`, `_redact_credential_header`, `_remove_cloud_headers`, `_remove_transport_headers`, `_strict_ignore_common_headers`, `_ignore_volatile_headers`, `_remove_header`.
  docs:
  - AGENTS.md
  - python/docs/usage.md
  tests:
  - core_tests/test_vcr_header_presets.ae
  - core_tests/test_vcr_keeps_headers.ae
  - core_tests/test_vcr_strict_ignore_headers.ae
  - core_tests/test_vcr_header_name_case.ae
  - python/test/test_record.py
  - python/test/test_record_mutation.py
  bindings: 'redact_credentials, redact_credential_header, remove_cloud_headers, remove_transport_headers:
    every binding. ignore_volatile_headers, remove_header: most (not found in Gleam,
    LFE; ignore_volatile_headers also not Clojure, F#). strict_ignore_common_headers:
    public method only in C, C++, Crystal, D, Julia, Nim, Swift, Janet'
- slug: structured-redaction
  title: Structured redaction
  group: Secrets and redaction
  summary: Redact a named header, query parameter or JSON field when the tape is written,
    or any text by pattern; unredact on playback; or collapse a pattern across the
    whole tape.
  body: |
    Secrets should not reach a committed tape. Redaction rewrites the **tape only**: the upstream still receives the real credential and your client still gets the real response.

    **Structured helpers** (no pattern to write; default replacement `[REDACTED]`):

    - `redact_header(name)`: every header with that name, case-insensitively. Request scope by default; pass `field=` for response headers.
    - `redact_query_param(name)`: every occurrence in the URL query, matched after percent-decoding. The replacement is percent-encoded, so `[REDACTED]` appears as `%5BREDACTED%5D` in the tape's request line.
    - `redact_json_field(name)`: that key at every depth, case-sensitively. The whole value becomes a JSON string, even a number or object. Unrelated bytes keep their layout. A non-empty body that is not valid JSON **fails the commit** and writes nothing.

    **Literal and whole-tape.** `redact(field, pattern, replacement)` replaces text in one field (`Path`, `RequestHeaders`, `RequestBody`, `ResponseHeaders`, `ResponseBody`). `redact_whole_tape(pattern, replacement)` rewrites every regex match, in every field, to one constant: good for values nothing correlates, such as a timestamp (values that must correlate are volatile values). Rules run in registration order at write time.

    **Unredact.** Redacting a request expectation does not change matching: playback still compares live requests with the tape. `unredact(field, pattern, replacement)` on the playback VCR restores a known test value in the expectation, so the scrubbed tape still matches. Or the test can send the recorded replacement.

    ```python
    import servirtium
    from servirtium import Field

    with servirtium.record("tapes/login.md", upstream) \
            .redact_header("Authorization").redact_query_param("password") \
            .redact_json_field("secretKey").redact(Field.REQUEST_BODY, "hunter2", "PASSWORD") \
            .port(0).start() as rec:
        login(rec.base_url)
        rec.commit()      # tape: Authorization: [REDACTED], ?password=%5BREDACTED%5D, "secretKey": "[REDACTED]"

    with servirtium.playback("tapes/login.md") \
            .unredact(Field.PATH, "%5BREDACTED%5D", "hunter2") \
            .unredact(Field.REQUEST_HEADERS, "[REDACTED]", "Basic Ym9iOnB3").port(0).start() as vcr:
        login(vcr.base_url)   # the real values still match the scrubbed tape
    ```

    I ran a POST with a password query parameter, a `secretKey` number, and an `Authorization` header: the tape held the replacements above, the upstream saw the originals, and playback matched both with the redacted values and via `unredact` with the real ones.

    C ABI: `aether_vcr_embed_redact`, `_redact_header`, `_redact_query_param`, `_redact_json_field` (all take `(handle, field, name, replacement)`; query scope must be `Path`), `_unredact`, `_redact_whole_tape`, `_redact_whole_tape_described`.
  docs:
  - docs/redaction-helpers.md
  - python/docs/usage.md
  tests:
  - core_tests/test_vcr_redaction_helpers.ae
  - core_tests/test_vcr_redactions.ae
