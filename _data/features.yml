- slug: substitute-and-placeholders
  title: Substitute, placeholders and request-header tokens
  group: Values and bodies
  summary: 'Playback-side rewriting of replayed responses: your own placeholders via
    Substitute, the VCR''s own address via {{baseUrl}}, and a live request header
    echoed back.'
  body: |
    A tape recorded last month holds last month's addresses. These playback features fill the right values at replay time. All are configured on the **playback** VCR before it starts.

    **Built-in tokens (no registration).** `{{baseUrl}}` (scheme, `://`, the live request's Host), `{{request.host}}` and `{{request.scheme}}` are filled from the request being answered, in a recorded response (body and headers) and, since alpha.20, in a recorded request (path, headers, body) when comparing. So a tape holding the VCR's own URL replays on port 0 with no setup, and a different address is still a mismatch.

    **`{{request.header.NAME}}`** is filled with the live request's `NAME` header, **in responses only** (on the request side it would match any value). Use it for services that echo an id the client verifies (Azure Storage's `x-ms-client-request-id`): record that response header with `redact_header` and the token as the replacement.

    **`substitute(field, pattern, replacement, required=True)`** rewrites your **own** placeholders in the replayed response, in the body, headers, or both (a literal pattern, not a regex). With `required` (the default), `assert_all_redactions_used` reports a rule that never fired; `substitute_optional` exempts it, for a shared fixture a given tape may not exercise. `assert_no_unfilled_placeholders` catches a placeholder left in a response.

    **`unredact`** is the request-side partner (see structured redaction). .NET also offers `Placeholder(marker, value)`, one call that registers an unredact on the path and request body plus a response substitution.

    In .NET the field is `VcrResponseField` (`ResponseBody`, `ResponseHeaders`, `Response`); `VcrField.Response` no longer exists for Substitute.

    ```python
    import servirtium
    from servirtium import Field

    # tape (hand-written or recorded) has, in a response:
    #   Location: {{vault}}/widgets/1
    #   x-ms-client-request-id: {{request.header.x-ms-client-request-id}}
    #   {"self":"{{baseUrl}}/widgets","next":"{{vault}}/widgets?page=2"}
    with servirtium.playback("tapes/widgets.md") \
            .substitute(Field.RESPONSE, "{{vault}}", "https://vault.example").port(0).start() as vcr:
        reply = fetch(vcr.base_url + "/widgets", headers={"x-ms-client-request-id": "req-42"})
        vcr.assert_all_redactions_used()
        vcr.assert_no_unfilled_placeholders()
    ```

    I ran this against a hand-written tape on the release macOS arm64 library: the body came back with `self` set to the VCR's own address, `next` pointing at `https://vault.example`, `Location` rewritten, and `x-ms-client-request-id` echoing `req-42`; both assertions passed.

    C ABI: `aether_vcr_embed_substitute` (`field`: 2 ResponseBody, 5 ResponseHeaders, 6 Response; plus `required` 0/1), `_clear_substitutions`, `_assert_all_redactions_used`, `_assert_no_unfilled_placeholders`, `_unredact`.
  docs:
  - docs/vcr-address.md
  - docs/redaction-helpers.md
  - AGENTS.md
  tests:
  - core_tests/test_vcr_self_address.ae
  - core_tests/test_vcr_request_header_token.ae
  - core_tests/test_vcr_unredactions.ae
  - python/test/test_playback_match.py
  - dotnet/Servirtium.Vcr.Tests/SubstituteTests.cs
  bindings: 'unredact: every binding. substitute / substitute_optional: Dart, .NET,
    Elixir, Erlang, Go, Haskell, Janet, Java, JavaScript, Lua, Nim, Pharo, PHP, Python,
    Ruby, Rust, Zig (and Kotlin/Scala/Groovy/F#/Clojure through Java/.NET); not C,
    C++, Crystal, D, Julia, Swift, Gleam, LFE. Placeholder(marker, value): .NET only.
    Built-in {{baseUrl}} / {{request.*}} tokens: core, every binding'
- slug: binary-bodies-and-encodings
  title: Binary bodies and encodings
  group: Values and bodies
  summary: Binary bodies are base64 on the tape, text bodies keep their exact bytes
    (CRLF included), gzip is decoded, and chunking never reaches the tape.
  body: |
    A tape is markdown, so what goes into it has to survive an editor and git. Servirtium records HTTP **messages**, not connections: what the app means, never the framing.

    **Binary bodies.** A body with a control byte (other than tab, LF, CR), DEL, or that is not well-formed UTF-8 is written as **base64**, wrapped at 76 columns, under a heading marked `base64 below`: `(application/octet-stream base64 below)` on a request, `(200: application/octet-stream base64 below)` on a response. The reader decodes it on load, so request matching compares bytes and playback replays the original bytes. Text rules (redaction, volatile values, pretty-printing) skip a binary body.

    **Text bodies are byte-exact, CR included.** A CRLF inside a body is payload and stays as sent. Tape structure is written with LF; a tape that has been converted wholesale to CRLF (an autocrlf checkout) still parses. Keep tapes out of git's line-ending conversion (`*.md -text`).

    **Encodings.**

    - **Chunked** transfer is decoded: the tape holds the payload. A `Transfer-Encoding: chunked` header stays on the tape as sent (a recording has no built-in drop list), but playback does not replay it: the server frames its own response with `Content-Length`.
    - **gzip alone** on a body that inflates is stored **decoded**, without that response's `Content-Encoding` and `Content-Length`; a playback client that sends `Accept-Encoding: gzip` gets it compressed again. Any other `Content-Encoding` (a list such as `deflate, gzip`, a body that is not really gzip, an empty body under the header) is kept as sent and replayed verbatim.
    - The VCR code decodes **gzip only**. The release libraries link brotli and zstd for the HTTP stack, but the VCR has no brotli or zstd decoding of its own; those encodings are kept as sent.
    - Playback invents no `Content-Type` the recording lacked, and a HEAD response keeps its `Content-Length`.

    ```python
    import servirtium

    with servirtium.record("tapes/files.md", upstream).port(0).start() as rec:
        fetch(rec.base_url + "/chunk")   # chunked reply: tape holds "hello world"
        fetch(rec.base_url + "/bin")     # bytes 0..255: tape holds base64 under "base64 below"
        fetch(rec.base_url + "/crlf")    # "a\r\nb\r\n": CRs stay in the tape
        rec.commit()

    with servirtium.playback("tapes/files.md").port(0).start() as vcr:
        raw = fetch(vcr.base_url + "/bin")   # the original 256 bytes
    ```

    I ran this on the release macOS arm64 library: the 256 bytes round-tripped exactly through base64, the chunked body was stored as `hello world` and replayed with `Content-Length: 11`, and the CRLF body came back as `a\r\nb\r\n`.
  docs:
  - AGENTS.md
  - docs/pretty-json.md
  tests:
