- slug: volatile-values
  title: Volatile values
  group: Values and bodies
  summary: Declare where per-run values sit; the tape holds numbered tokens, playback
    binds the live values, and drift detection ignores them.
  body: |
    Some values change every run though nothing meaningful changed: a message id, a `Date` header, a request id, the port the test happened to start on. **Volatile-value rules** say where such values sit. One rule set serves recording, playback and drift detection:

    - **Recording** writes each value as a **token**, `{{messageId-1}}`, so re-recording an unchanged conversation gives a byte-identical tape.
    - **Playback** lets a token in a recorded request match whatever the live request carries there, remembers it, and puts it back wherever the same token appears in a response or later request.
    - **Drift detection** compares tokenized tapes, so volatile values never count as drift and everything else does.

    **Vocabulary.** A **placeholder** is `{{name}}` in a rule; a **token** is what the tape holds; to **bind** is to attach a real value to a token. A name used on both the request and response side is numbered by distinct value (`{{messageId-1}}`, `-2`); a one-sided name is written unnumbered (`{{serverDate}}`), so coincidences cannot change the tape.

    **Rules.** A rule is a scope (`request path`, `request headers`, `response headers`, `headers`, `request body`, `response body`, `body`) plus a **template** (literal text with placeholders, `{{name:regex}}` for an inline pattern) or a PCRE2 **regex** with named groups. **Profiles** load a vendor's rules from a file (first line `Markers: Mustache`), so every client applies the same ones. **Marker styles** are `{{ }}` (default), `${ }`, `[[ ]]`, set before any rule. Rules are written into the tape's `## Volatile values` block, after which playback needs none in code. A response token nothing bound before replay must be **bound** by the test (`bind("serverDate", ...)`), or start fails naming it. `volatile_report()` lists rules, binds, current bindings and warnings.

    ```python
    import servirtium

    rules = [("request body", '{"id":"{{messageId}}"}'),
             ("response body", '"echo":"{{messageId}}"'),
             ("response headers", "Date: {{serverDate}}")]
    rec = servirtium.record("tapes/msg.md", upstream).port(0)
    for scope, pattern in rules:
        rec = rec.volatile_rule(scope, pattern)
    with rec.start() as r:
        post_message(r.base_url, "abc-1")
        r.commit()        # tape: {"id":"{{messageId-1}}"} ... "echo":"{{messageId-1}}", Date: {{serverDate}}

    with servirtium.playback("tapes/msg.md") \
            .bind("serverDate", "Wed, 25 Nov 2026 09:00:00 GMT").port(0).start() as vcr:
        post_message(vcr.base_url, "zzz-9")   # a different id: the echo comes back as zzz-9
    ```

    I ran this on the release macOS arm64 library: a different live id replayed as the echo, and the report showed `binding: {{messageId-1}} = zzz-9`. Dollar-curly markers wrote `${messageId}` into the block.

    C ABI: `aether_vcr_embed_volatile_rule`, `_volatile_bind`, `_volatile_profile`, `_set_volatile_markers`, `_volatile_report`.
  docs:
  - docs/volatile-values.md
  tests:
  - core_tests/test_vcr_volatile_grammar.ae
  - core_tests/test_vcr_volatile_playback.ae
  - core_tests/test_vcr_volatile_record.ae
  - core_tests/volatile_fixture.ae
  - python/test/test_volatile.py
  - dotnet/Servirtium.Vcr.Tests/VolatileValuesTests.cs
