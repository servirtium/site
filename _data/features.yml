- slug: cli-serve-check
  title: 'The servirtium CLI: serve and check'
  group: Tools
  summary: A self-contained binary that replays tapes as a live stub server and lints
    them.
  body: |
    `servirtium` is a standalone static binary over the same pure-Aether core (no `.so`, no
    `SERVIRTIUM_VCR_LIB`, no language binding), built from `core/cli.ae` (`aeb core/.cli.ae` writes
    `target/servirtium`, or `ae build core/cli.ae -o servirtium`). It is not one of the release assets.

    **`servirtium serve <tape.md>[,more.md...] [port] [--ordered]`** replays a tape, or a comma-separated list
    concatenated into one, as a live server on `port` (default 8080) and blocks until killed. Zero code: curl
    it, point a front-end dev server at it, demo against it. It defaults to **match-multiple** playback, so
    repeated and out-of-order requests keep answering across the union of the tapes (first match wins);
    `--ordered` restores strict one-shot tape order over the concatenation, after which a request is
    `599 tape exhausted`.

    **`servirtium check [--canonical] <tape.md> ...`** lints tapes: each must parse (exit 0, else 1, so it
    works as a pre-commit hook). `--canonical` additionally requires the file to be byte-identical to the
    emitter's compact form, which is what a recording produces and what the `single_get.md` goldens are.
    The parser itself stays lenient and accepts the looser "blank line after every fence" style other
    Servirtium tools emit.

    ```sh
    servirtium check tapes/*.md
    servirtium check --canonical tapes/single_get.md
    servirtium serve tapes/users.md,tapes/orders.md 8080
    curl http://127.0.0.1:8080/users
    servirtium serve tapes/users.md 8080 --ordered      # each interaction once, in order
    ```

    Verified with a CLI built from the alpha.20 tree: `check` on a golden tape printed
    `ok - 1 interaction(s), canonical` and exited 0; on a file that is not a tape it printed
    `FAIL - tape (bad.md) contains no '## Interaction ' headers` and exited 1; `serve` answered the same path
    twice, and with `--ordered` the second request was `599 tape exhausted`. A hand-written tape that parsed
    but was not emitter-shaped failed `--canonical` with `emitter form is 568 bytes, file is 567 bytes`.
    A comma-separated `serve` list answered requests from both tapes.

    Usage errors exit 2 (no arguments, unknown command, bad port).
  docs:
  - README.md
  - AGENTS.md
  tests:
  - core_tests/cli-tests.sh
  - core_tests/.cli.ae
  bindings: CLI only; it is not part of any language binding and is not a release
    asset
- slug: har-import-export
  title: HAR import and export
  group: Tools
  summary: Turn a HAR 1.2 capture (Chrome DevTools, Fiddler, Charles, Postman) into
    a tape, and a tape back into HAR.
  body: |
    Traffic you cannot easily route through a recording proxy, such as a browser single-page app or a mobile
    app behind a debugging proxy, can still become a tape: capture it, export a `.har`, convert it once, and
    replay it under any binding.

    ```sh
    servirtium import capture.har tapes/session.md     # HAR 1.2 -> tape
    servirtium export tapes/session.md session.har     # tape -> HAR 1.2
    servirtium check --canonical tapes/session.md
    servirtium serve tapes/session.md 8080
    ```

    The tape goes through the same emitter that record mode uses, so it is byte-consistent with a native
    recording and passes `check --canonical`. The mapping choices are deliberate:

    - **Request headers are dropped.** A browser's volatile headers would never match a test client, so an
      imported tape matches on **method + path (+ request body)**, like the `single_get` golden.
    - **The request body is kept**, which tells apart POSTs to one path. For a JSON API pair it with
      `pretty_json` on playback.
    - **Response** status, headers and body are kept; hop-by-hop headers and `Content-Encoding` are dropped
      because the body is stored decoded. Header-name casing is kept as is (HTTP/2 HARs lower-case them).
      Base64 HAR content becomes the tape's `base64 below` body.
    - Export writes HAR 1.2 JSON; tape to HAR to tape is byte-identical in the round-trip test.

    Verified with a one-entry HAR (`GET http://x/ok` answering `ok-body`): the imported tape had an empty
    request-headers block, `Content-Type: text/plain`, `ok-body`, and passed `check --canonical`; `export`
    wrote HAR 1.2 JSON with `"creator":{"name":"servirtium-vcr"...}`.

    This is a convert-once offline step, so it is a CLI first. The functions are also in the C ABI for a
    binding that wants them: `aether_vcr_embed_har_import(har_path, tape_path)` and
    `aether_vcr_embed_har_export(tape_path, har_path)`, both returning an error string (empty on success).
    I found no per-language wrapper for either.
  docs:
  - README.md
  - AGENTS.md
  tests:
  - core_tests/test_vcr_har_import.ae
  - core_tests/test_vcr_har_export.ae
  - core_tests/cli-tests.sh
  bindings: CLI and C ABI only; no per-language wrapper that I could find
- slug: bruno-convert-and-import
  title: 'Bruno: convert and import'
  group: Tools
  summary: Turn a Bruno collection's saved examples into tapes with no network, or
    fire its requests through record mode to hydrate a tape from a live service.
  body: |
    Bruno stores each request as a `.bru` file in your repository. Servirtium reads those files with **Bruno's
    own parser** (`@usebruno/lang`, vendored and run in QuickJS inside the engine), then works out what each
    request means (variables, inherited headers and auth, path, body) in Aether.

    **`servirtium convert bru <collection> <out-dir> [--env NAME]`** converts the examples a collection
    saved, with no service and no network. Each request that has examples becomes one tape, one interaction per
    example, at a space-free slugged path (`Widget Things/Get One.bru` becomes `widget-things/get-one.md`; a
    collision gets `-2`). `<out-dir>/CONVERSION.md` lists what became what. Variables resolve from the request,
    its folders, the collection and `environments/NAME.bru`; one with no value stays as `{{name}}`. Every
    interaction carries a `## [Note]` naming its source and example and the headers the collection sends
    (credentials never written; request headers are not matched). Where an example documents no response body,
    the note's title says `response body not documented`, so an empty body is never mistaken for an empty
    response.

    **`servirtium import-bru <collection> <upstream> <out.md> [--var NAME] [--port N]`** is the other direction:
    it fires each request (folders included, in folder, `meta.seq`, then name order) through record mode against
    the real `<upstream>` and captures the live responses. The collection's base-URL variable (`{{baseUrl}}`;
    `--var` changes it) is the local record proxy. It sends no headers and no auth, and the tape matches on
    method, path and body. **It makes real calls**, with side effects for POST, PUT and DELETE.

    ```sh
    servirtium convert bru "My Collection" tapes/bruno --env Local
    servirtium serve tapes/bruno/widget-things/get-one.md 8080
    servirtium import-bru "My Collection" http://127.0.0.1:9000 tapes/hydrated.md
    ```

    ```javascript
    import { convertBru } from '@servirtium/vcr'
    convertBru('My Collection', 'tapes/bruno')          // third argument: environment name, '' for none
    ```

    Verified with the CLI: a one-request, one-example collection in a folder with a space converted to
    `widget-things/get-one.md` plus `CONVERSION.md`, and the tape served the example's body. `import-bru` against
    a local Python upstream hydrated one interaction and the tape passed `check --canonical`.

    C ABI: `aether_vcr_embed_convert_bru(collection_dir, out_dir, env)`. The JavaScript binding wraps it as
    `convertBru`; I found no other binding wrapper. `import-bru` is CLI only.
  docs:
  - README.md
  - docs/bruno-import-idioms.md
  - bruno_import_demo/README.md
  tests:
  - core_tests/test_vcr_bru_convert.ae
  - core_tests/test_vcr_bru_upstream.ae
  - core_tests/cli-tests.sh
  - javascript/src/convert-bru.test.ts
  bindings: CLI (convert bru, import-bru), the C ABI (convert_bru) and the JavaScript
    binding (convertBru) only
- slug: platforms-and-release
  title: Platforms and release
  group: Repository
  summary: The platform matrix the engine is cross-built for, from one Linux host,
    and how a tag becomes a release.
  body: |
    The engine is pure Aether plus a 12-line C string bridge, so it cross-compiles for the whole matrix from
    **one Linux runner** with `ae build --target` (zig cc), with no per-OS build runner:

    | Platform | CPUs | Asset suffix |
    |---|---|---|
    | Linux glibc | x86_64, arm64 | `linux-<arch>.so` |
    | Linux musl | x86_64, arm64 | `linux-<arch>-musl.so` |
    | macOS | x86_64, arm64 | `macos-<arch>.dylib` |
    | Windows | x86_64, arm64 | `windows-<arch>.dll` (+ `.dll.lib`) |
    | FreeBSD | x86_64 | `freebsd-x86_64.so` |

    No 32-bit Windows or Linux, and no FreeBSD arm64 yet (it awaits a matching sysroot). All nine libraries
    must build, and the workflow verifies every checksum, both Windows import libraries and the C ABI's exports.
    Consumers need Aether 0.838.0 or newer for libc-aware selection of the glibc and musl Linux packages.

    **Release flow.** Pushing a `v*` tag starts the GitHub release workflow: it cross-builds, verifies,
    creates the release (prerelease tags are marked as such) and downloads the published assets again to check
    them. It also creates `go/v<version>` for the Go module and a second, bare semver tag for SwiftPM, carrying
    the artifact bundle's checksum in `Package.swift` (the checksum cannot exist until the bundle is built, so
    the `v` tag's commit has the source form and the bare tag's commit has the binary form). Never create either
    by hand. `release/.version.ae` rewrites every version pin from one tag, each in its ecosystem's spelling
    (Python `2.0.0a20`, RubyGems `2.0.0.alpha.20`, SemVer elsewhere).

    ```sh
    SVCR_RELEASE_SET=v2.0.0-alpha.20 aeb release/.version.ae     # rewrite every pin from the tag
    SVCR_RELEASE_TAG=v2.0.0-alpha.20 aeb release/.version.ae     # check them all
    release/build.sh                                             # linux + macos locally
    RELEASE_EXTRA_TARGETS=1 release/build.sh                     # + windows and freebsd
    ```

    The release also carries `ae add` binary packages (the same libraries under `servirtium_vcr-<tag>-...` names
    plus an `aether.toml`) for Aether programs. Verified against `gh release view` for the alpha.20 asset
    names, and `release/README.md`, `release/targets.env` and `release/toolchain.env` (Aether v0.945.0, aeb
    v0.348, zig 0.17.1) for the rest; I did not run the build.
  docs:
  - release/README.md
  - docs/packaging.md
  - release/targets.env
  - release/toolchain.env
  tests:
  - release/.tests.ae
  - release/artifact_tests.ae
  - release/artifacts.ae
  bindings: not binding-specific
- slug: tape-format
  title: The tape format
  group: Repository
  summary: 'The Servirtium markdown tape as the emitter writes it today: interactions,
    an optional licence notice, volatile-values block and rules footer, {{tokens}}
    and base64 bodies.'
  body: |
    A tape is plain markdown that renders on GitHub and diffs in a review. The emitter writes a **compact**
    form that is canonical here (`servirtium check --canonical` enforces it): the next `###` heading follows a
    closing code fence directly, blank lines separate interactions, and one trailing blank line ends the tape. The
    parser is lenient and also accepts the looser "blank line after every fence" style other Servirtium
    implementations emit. Recording a tape is only done by `commit`; a `*` around the method
    (`emphasize_http_verbs`) and 4-space indented blocks (`indent_code_blocks`) are opt-in.

    ~~~~text
    ## LICENSE NOTICE                       (optional, add_license_notice; plain text, once, before Interaction 0)

    ## Volatile values                      (optional: the rules that produced {{name-N}} tokens, before Interaction 0)

    - request body: `<a:MessageID>urn:uuid:{{messageId}}</a:MessageID>`

    ## Interaction 0: POST /orders

    ## [Note] Create:                       (optional, from note(); ignored by playback)

    why this exists

    ### Request headers recorded for playback:

    ```
    Content-Type: application/json
    ```
    ### Request body recorded for playback (application/json):

    ```
    {"item": 7}
    ```
    ### Response headers recorded for playback:

    ```
    Content-Type: application/json
    ```
    ### Response body recorded for playback (201: application/json):

    ```
    {"id": "{{uuid-1}}"}
    ```

    ## [Recording rules]                    (optional footer, set_rules_footer; everything after it is ignored)
    ~~~~

    **Headings.** The request-body heading carries the content type, the response-body heading the status and
    type, `(201: application/json)`. Request headers are written sorted by name; response headers in the order the
    service sent them; header names keep their casing.

    **Binary bodies are base64.** A body that is not text (a control byte, or not well-formed UTF-8) is written
    wrapped at 76 columns under a heading marked `base64 below`: `(<type> base64 below)` for a request and
    `(200: <type> base64 below)` for a response. Text bodies, carriage returns included, stay byte-exact; a tape
    converted wholesale to CRLF still parses.

    **Tokens.** `{{baseUrl}}`, `{{request.host}}`, `{{request.scheme}}` and `{{request.header.NAME}}` are filled by
    playback (see "The VCR's own address"). `{{name-N}}` and `{{name}}` are volatile-value tokens, numbered per
    value, that playback binds to the live value; a literal token-shaped text is escaped with a backslash. The
    marker style can be `${ }` or `[[ ]]` instead.

    **The footer.** `## [Recording rules]` is a table of what the test left out or rewrote (removed headers,
    redactions, normalizations) and the interactions each touched. The parser **stops** at that heading, so
    nothing in a footer can become an interaction.

    Keep tapes out of git's line-ending conversion (`*.md -text` for the tape directory). I confirmed the layout
    by recording through the Python binding (licence notice, note, headers, body) and importing a HAR; the
    footer and volatile block are quoted from the committed tapes under `core_tests/volatile/` and
    `pre-recorded/joomla-api/`.
  docs:
  - README.md
  - AGENTS.md
  - docs/volatile-values.md
  - docs/vcr-address.md
  tests:
  - core_tests/test_vcr_rules_footer.ae
  - core_tests/test_vcr_license_notice.ae
  - core_tests/test_vcr_notes.ae
  - core_tests/test_vcr_binary_body.ae
  - core_tests/test_vcr_bom_crlf.ae
  - core_tests/test_vcr_crlf_body.ae
  - core_tests/test_vcr_format_options.ae
  - core_tests/cli-tests.sh
  bindings: not binding-specific; the format is the core's
- slug: packaging-and-get-package-sh
  title: Packaging and get-package.sh
  group: Repository
  summary: What a release actually ships, how to build any language's package from
    the tag with get-package.sh, and the platform matrix.
  body: |
    **What a release ships.** Nothing is published to a registry (no PyPI, npm, crates.io, NuGet.org or Maven
    Central) and there may never be. Each GitHub release (`@TAG@`) attaches only:

    - per-platform native libraries, `libservirtium_vcr-@TAG@-<os>-<arch>.{so,dylib,dll}` with a `.sha256` each
      (Windows also `.dll.lib`), for Linux glibc and musl (x86_64, arm64), macOS (x86_64, arm64), Windows
      (x86_64, arm64) and FreeBSD x86_64. There is no 32-bit build;
    - `servirtium-vcr-@VER@.jar`, a fat jar with six natives (Linux, macOS, Windows, x64 and arm64);
    - `Servirtium.Vcr.@VER@.nupkg`, targeting net8.0 and net48, eight RIDs including musl;
    - `servirtium-vcr-@VER@.tgz`, the npm tarball with eight natives;
    - `servirtium-vcr-swift-@TAG@.artifactbundle.zip` (static libraries), which the root `Package.swift` downloads;
    - `SHA256SUMS.txt`.

    Every other language has **no shipped package**: you fetch the native library for your platform and use the
    binding from the tagged source, or build the package locally.

    **`get-package.sh <language>`** builds that language's package from source with the pinned toolchain. It
    runs `bootstrap.sh` (installing the pinned `ae` and `aeb`), runs one target, `<lang>/.package.ae`, copies the
    artifact to `./out/<lang>/` and prints the command to consume it. It runs **no tests**.

    ```sh
    ./get-package.sh                # list the 30 languages
    ./get-package.sh ruby           # build the gem, copy it to ./out/ruby, print "gem install ..."
    ./get-package.sh all            # every language's package (aeb .packages.ae)

    # from a bare machine: clones into ~/.cache/servirtium-vcr first
    curl -fsSL https://raw.githubusercontent.com/servirtium/servirtium-vcr/main/get-package.sh | sh -s -- ruby
    ```

    Environment: `OUT` (where artifacts go, default `./out`), `SERVIRTIUM_SRC` (the checkout used when piped),
    `PREFIX` (toolchain prefix). Languages without a file artifact (Rust, Go, Nim, Zig, Haskell, Crystal, Julia,
    Janet, Swift, D, PHP, Dart, Pharo) are source packages with the library staged inside, which you point a path
    dependency at; Java and the JVM four install into `~/.m2`; the BEAM four share one relocatable
    `servirtium_nif` OTP app.

    Without the Aether toolchain: `aeb ruby/.package.ae --overrideDep core/.build.ae=core/.getFromGitHubReleases.ae`
    downloads the prebuilt library from the release and verifies its `.sha256` instead of compiling it.

    Verified by reading `get-package.sh`'s language table and `--help`-less listing behaviour; I did not build a
    package with it. The release asset list was checked with `gh release view v2.0.0-alpha.20`.
  docs:
  - docs/packaging.md
  - release/README.md
  - get-package.sh
  - README.md
  tests:
  - release/.tests.ae
  - release/artifact_tests.ae
  - release/artifacts.ae
  - ".packages.ae"
  bindings: all 30 languages
- slug: three-test-layers
  title: Three test layers
  group: Repository
  summary: Every language has a .package.ae, a .tests.ae and a .example.ae, answering
    three different questions, on top of the core's own pure-Aether tests.
  body: |
    One engine, thin bindings: so the tests are split by the question each one answers, and each is an `aeb`
    leaf (`aeb <lang>/.tests.ae`). All 30 languages have all three.

    | Leaf | Question it answers | Needs |
    |---|---|---|
    | `<lang>/.package.ae` | can I **build** the distributable? | that language's compiler and packer, **no test runner** |
    | `<lang>/.tests.ae` | does the **binding** work? | its compiler and test runner |
    | `<lang>/.example.ae` | can a **stranger install and use it**? | a clean environment and the package |

    **`.tests.ae`** runs the binding's own suite against the source tree, with the engine handed in through
    `SERVIRTIUM_VCR_LIB`. It proves the binding works, not that a downstream user can install it.

    **`.package.ae`** builds the idiomatic distributable the way a consumer receives it (wheel, gem, npm
    tarball, nupkg, jar in `~/.m2`, crate, ...) with the engine bundled inside, and runs **no tests**, so a
    wheel builds on a box with no pytest.

    **`.example.ae`** installs that artifact into a **clean** environment (a fresh venv, an isolated gem
    directory, a local NuGet feed, a relocated package) and runs `<lang>/example/`, a real consumer project that
    imports the installed package and replays the canonical `single_get` tape with `SERVIRTIUM_VCR_LIB` unset,
    so only the bundled engine can satisfy the load. Python, Rust and Java also record and compare their tape
    byte for byte with the golden. This layer caught bugs a green `.tests.ae` hid (Swift's relative `-L`, a
    `dub.json` warning).

    **Below the bindings**, `core_tests/` holds the pure-Aether tests of the core itself (`test_vcr_*.ae`), the
    CLI's black-box `cli-tests.sh`, shared fixtures under `target/test-tools/` that every binding's tests
    reuse, and `release/.tests.ae`, which checks the release verifier's success and failure paths.

    ```sh
    aeb core_tests/.tests.ae        # the core, first
    aeb python/.tests.ae            # one binding's suite
    aeb python/.package.ae          # build the wheel
    aeb python/.example.ae          # install it into a clean venv and run the consumer example
    aeb .packages.ae                # every language's package, one command
    ```

    Never run two top-level `aeb` commands at once in one checkout; they share a build workspace. Not run by me
    (they need `ae` plus `aeb` and each language's tools); read from AGENTS.md and docs/packaging.md.
  docs:
  - AGENTS.md
  - docs/packaging.md
  - docs/dev-setup.md
  tests:
  - core_tests/.tests.ae
  - python/.tests.ae
  - python/.package.ae
  - python/.example.ae
  - release/.tests.ae
  - ".packages.ae"
  bindings: all 30 languages
- slug: sdk-harnesses
  title: SDK harnesses
  group: Repository
  summary: A vendor SDK's own test suite, unchanged, with Servirtium in the middle
    of its HTTP; today one harness, the Azure SDK for .NET Blob Storage tests against
    Azurite.
  body: |
    `sdk_harnesses/` shows Servirtium slotting into a suite someone else wrote and maintains. Each
    subdirectory is named after the upstream repository it drives. **What is in it today:** one harness,
    `azure-sdk-for-net/`, which runs `Azure.Storage.Blobs`' own tests against Azurite (Microsoft's Azure Storage
    emulator in a container).

    What every harness keeps to:

    - **Upstream sources are fetched, never checked in**: a pinned commit, sparse-checked-out into the harness's
      `target/`. Checked in are the glue, the runner, the README and the recordings.
    - **Recordings are made only against software running locally**, never a vendor-hosted API, and each names
      its provenance: upstream repository and commit, licence, the emulator's image tag.
    - **Everything the toolchain downloads stays in the harness's `target/`.**
    - **Runner: aeb**: `.build.ae` fetches and builds, `.tests.ae` replays offline, `.record.ae` re-records.

    The Azure harness has three modes: **record** (the tests run against Azurite with Servirtium between, one
    tape per test), **playback** (the same tests with no container engine; a passing test fails if its tape
    has interactions it never asked for) and **negative** (a tape altered by hand makes its test fail, so
    playback is checking something). Last reported run (2026-11-12): 2168 test runs, 1478 passing in record and
    1478 in playback, 690 excluded or skipped, no failures; 1110 tapes, 13 MB, 641 of them with a binary body
    as base64.

    It found real engine gaps, now fixed in core: binary bodies as base64, an empty request framed
    `Content-Length: 0`, `Expect` never forwarded, `forward_host` (record mode sends the upstream the client's
    Host; .NET only so far), and `{{request.header.NAME}}`.

    ```sh
    aeb sdk_harnesses/azure-sdk-for-net/.tests.ae    # fetch + build, then playback and negative checks
    aeb sdk_harnesses/azure-sdk-for-net/.record.ae   # re-record against Azurite, then play the new tapes back
    ```

    Needs the .NET 10 SDK and git, and Docker or Podman only for recording. Not run by me (no .NET SDK here);
    counts are from the harness README.
  docs:
  - sdk_harnesses/README.md
  - sdk_harnesses/azure-sdk-for-net/README.md
  tests:
  - sdk_harnesses/azure-sdk-for-net/run.sh
  - sdk_harnesses/azure-sdk-for-net/negative.txt
  - core_tests/test_vcr_binary_body.ae
  - core_tests/test_vcr_forward_host_and_expect.ae
  - core_tests/test_vcr_request_header_token.ae
  bindings: ".NET (the harness drives the .NET binding)"
- slug: pre-recorded
  title: Pre-recorded tapes
  group: Repository
  summary: 'Re-usable tapes of real services'' HTTP APIs: 64 services recorded through
    testcontainers (tapes shipped for 57), a Joomla API suite, an NTLM suite and a
    converted Bruno collection.'
  body: |
    `pre-recorded/` holds tapes you can replay in any language's tests, with no container and no service:
    `servirtium serve <tape.md>` from the CLI, or any binding's playback. Only services with an HTTP API can be
    here, since Servirtium records HTTP messages (not Mongo, Postgres, Redis or Kafka).

    | Directory | What made the recordings |
    |---|---|
    | `from-testcontainers/` | Aether tests that start each service with testcontainers-ae and put Servirtium in the middle |
    | `joomla-api/` | A test that starts Joomla 6.2.0 and MariaDB 11.4 in containers: CRUD on articles, categories, tags, banners and users, ids chained; 8 tapes |
    | `ntlm/` | A pytest suite with our own NTLM-protected server and four Python clients; 8 tapes (see "NTLM and Negotiate") |
    | `converted/from.bru/` | `servirtium convert bru` on René Kreijveld's Joomla 6 Web Services Bruno collection, as it is: the author's examples, not recordings (189 of 194 interactions have no response body, and say so). 182 tapes, **GPL-3.0** like the collection, kept apart from the MIT rest |

    **Counting `from-testcontainers/` accurately:** the directory has 66 entries. Two are not services (`lib/`
    and `servirtium/`, the module every suite uses), leaving **64 services**. For **57** of them the tapes are
    shipped (240 tape files in all); for **7** (`cockroachdb`, `dynamodb`, `gcloud_datastore`,
    `gcloud_firestore`, `gcloud_pubsub`, `pinecone`, `timeplus`) only the test and recorder are shipped, because a
    vendor's terms could reasonably be read as forbidding published recordings. Run such a test with
    `TCAE_VCR=record` for your own tapes and do not publish them.

    **Licences and terms bind anyone using a tape.** `from-testcontainers/UPSTREAM-TERMS.md` and `NOTICE` list
    them, tapes of a service with restrictive terms start with a `## LICENSE NOTICE`, and a converted collection
    carries its source's licence in its own directory with its source repository and pinned commit. Each
    service's README says whether its tapes are an emulator's answers or the real product at a pinned version;
    either way, record against your own target before trusting details.

    ```sh
    servirtium serve pre-recorded/joomla-api/tapes/refuses_a_request_without_a_token.md 8080
    curl -H 'Accept: application/vnd.api+json' \
         -H 'User-Agent: servirtium-vcr pre-recorded tests (Aether std.http.client)' \
         http://127.0.0.1:8080/api/index.php/v1/content/articles
    # {"errors":[{"title":"Forbidden"}]}   (401)
    ```

    Replaying needs the request to match what the tape recorded: this tape recorded `Accept` and `User-Agent`,
    so a bare `curl` gets `599` (verified), while with those two headers it gets the recorded 401. A tape
    converted from Bruno or imported from HAR has an empty request-headers block and matches on method, path and
    body only. Verified by serving that tape with the CLI built from the alpha.20 tree. The counts above were
    computed from the working tree.
  docs:
  - pre-recorded/README.md
  - pre-recorded/from-testcontainers/README.md
  - pre-recorded/from-testcontainers/UPSTREAM-TERMS.md
  - pre-recorded/joomla-api/README.md
  - pre-recorded/ntlm/README.md
  - pre-recorded/converted/from.bru/renekreijveld_bruno-joomla-api/README.md
  tests:
  - pre-recorded/joomla-api/test_joomla.ae
  - pre-recorded/from-testcontainers/vault/test_vault.ae
  - pre-recorded/ntlm/test_ntlm.py
  bindings: 'not binding-specific: tapes replay under any Servirtium implementation'
- slug: c-abi
  title: The C ABI
  group: Repository
  summary: 99 exported functions, all prefixed aether_vcr_embed_ and all taking an
    opaque per-server handle; every binding is a thin wrapper over them.
  body: |
    Everything Servirtium does lives in one library, `libservirtium_vcr`, written in pure Aether. `core/embed.ae` is its C ABI: **99 exported functions**, each prefixed `aether_vcr_embed_`. A language binding opens a handle, configures it, starts it, reads the base URL, and stops; nothing smarter belongs in a binding.

    **Conventions.** Every call takes the opaque handle of one VCR (N servers can run in one process, one per port; there is no process-wide state). Config calls return a `char*` error: an empty string means success. Returned strings are caller-owned and NUL-terminated: copy them out and free with `aether_vcr_embed_free_string`. `Field` ints: `Path` 1, `ResponseBody` 2, `RequestHeaders` 3, `RequestBody` 4, `ResponseHeaders` 5, and 6 (`Response`, substitution only). Outcome (`last_kind`): `Ok` 0, `PathOrMethodDiff` 1, `HeaderMissing` 2, `HeaderValueDiff` 3, `HeaderUnexpected` 4, `TapeExhausted` 5, `BodyDiff` 6, `RecordError` 7.

    **Function families (counts are from `core/embed.ae`).**

    | Family | Count | Functions |
    |---|---|---|
    | Lifecycle | 12 | `open_playback`, `open_playback_url`, `open_record`, `open_error`, `start`, `stop`, `close`, `destroy`, `discard`, `stop_and_flush`, `stop_and_flush_fail_if_changed`, `stop_and_flush_or_check` |
    | Introspection and TLS | 7 | `port`, `base_url`, `tape_length`, `reset_cursor`, `last_tls_protocol`, `set_tls`, `set_tls_pem` |
    | Diagnostics and assertions | 11 | `last_error`, `last_error_ex`, `diagnostics_json`, `assert_no_mismatches`, `test_context`, `last_kind`, `last_index`, `clear_last_error`, `assert_all_consumed`, `assert_all_redactions_used`, `assert_no_unfilled_placeholders` |
    | Redaction and rewriting | 11 | `redact`, `redact_header`, `redact_query_param`, `redact_json_field`, `redact_whole_tape`, `redact_whole_tape_described`, `unredact`, `remove_header`, `substitute`, `redact_credentials`, `redact_credential_header` |
    | Header presets | 4 | `strict_ignore_common_headers`, `ignore_volatile_headers`, `remove_transport_headers`, `remove_cloud_headers` |
    | Volatile values | 5 | `volatile_rule`, `volatile_bind`, `volatile_profile`, `set_volatile_markers`, `volatile_report` |
    | Named secrets | 7 | `secret_begin`, `_next`, `_get`, `_interaction`, `_apply`, `_finish`, `_abort` |
    | Record options | 9 | `set_upstream_cafile`, `set_forward_host`, `set_rewrite_upstream_base`, `get_rewrite_upstream_base`, `add_license_notice`, `note`, `set_rules_footer`, `indent_code_blocks`, `emphasize_http_verbs` |
    | Formatting and stable order | 12 | `set_pretty_json`/`get_`, `set_pretty_xml`/`get_`, `set_sort_json_keys`/`get_`, `sort_json_array`, `sort_json_array_at`, `set_sort_response_headers`/`get_`, `sort_header_value`, `clear_stable_order` |
    | Playback matching | 8 | `set_strict_headers`, `set_match_multiple`, `match_header`, `clear_match_headers`, `set_playback_range`, `clear_playback_range`, `get_playback_range_from`, `get_playback_range_to` |
    | Static and untaped paths | 2 | `static_content`, `untaped` |
    | Resets | 7 | `clear_redactions`, `clear_unredactions`, `clear_header_removals`, `clear_static_content`, `clear_untaped`, `clear_format_options`, `clear_substitutions` |
    | Converters and tools (no handle) | 3 | `har_import`, `har_export`, `convert_bru` |
    | String ownership | 1 | `free_string` |

    The three **tools** are file-to-file: `har_import` turns a HAR 1.2 capture into a tape, `har_export` is its inverse, and `convert_bru` converts a Bruno collection's examples into tapes (a summary lands in `CONVERSION.md`). The standalone `servirtium` CLI links the same core directly.

    **Library lookup.** Bindings that load the library at run time find it via `SERVIRTIUM_VCR_LIB` (an absolute path), a `native/` directory beside the binding, or the OS loader; link-time bindings bake the path in. Build the library yourself with `ae build --emit=lib --with=fs,net,extern core/embed.ae --extra core/_embed_strdup.c`, or take the per-platform release library. Rust's `src/native.rs` is the canonical 1:1 symbol table.
