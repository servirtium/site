    no wrapper that I found, it is core/C ABI and used by the pre-recorded recorder'
- slug: named-secret-callbacks
  title: Named secret callbacks
  group: Secrets and redaction
  summary: Your code decides which fields are secrets and names them at record time,
    then supplies the real values at playback; the tape holds only names.
  body: |
    Pattern redaction needs you to know the secret's text. Named secret callbacks go the other way: the core finds the fields (query, form, header, JSON, XML, YAML, multipart text), and **your callback decides** whether each is a secret and what to call it. It never guesses that a URL "belongs to billing"; your code does.

    **Recording.** A `secret_redactor` callback receives the decoded key and a request snapshot (`method`, `path`, `location`, `format`, `field_path`, `interaction`) and returns a token name, or nothing to leave the field alone. The tape then holds a marker such as `{{secret:ACCOUNTS_PASSWORD|1}}` (URL-encoded inside a query). Names are 1-128 ASCII letters, digits, dots, underscores, colons or dashes. Four services with four passwords on one port just need the callback to look at the path.

    **Playback.** A `secret_resolver` callback receives only the token name and returns the real value, before the server starts listening. Named tokens **require** a resolver: they are never quietly served as credentials, and returning nothing for a token fails setup.

    **Safety.**

    - A callback exception, an invalid decision, or unfinished staging prevents the tape being written.
    - Resolving changes playback's in-memory expectations only; a resolved playback can never be flushed as plaintext.
    - Resolved values are masked in mismatch diagnostics.
    - There are no callbacks into your language runtime from the native HTTP worker: the binding runs your callback between ordinary FFI calls (the seven `secret_*` ABI calls).

    ```python
    import servirtium

    with servirtium.record("tapes/pay.md", upstream).secret_redactor(
            lambda key, request: "ACCOUNTS_PASSWORD" if key == "password" else None
    ).port(0).start() as rec:
        pay(rec.base_url)            # ...?user=bob&password=hunter2
        rec.commit()                 # tape: password=%7B%7Bsecret%3AACCOUNTS_PASSWORD%7C1%7D%7D

    with servirtium.playback("tapes/pay.md") \
            .secret_resolver({"ACCOUNTS_PASSWORD": "hunter2"}.get).port(0).start() as vcr:
        pay(vcr.base_url)
        vcr.assert_no_mismatches()
    ```

    I ran exactly this against a local upstream with the release macOS arm64 library: the tape held the named marker and no password, and the resolved replay matched.

    C ABI: `aether_vcr_embed_secret_begin`, `_secret_next`, `_secret_get`, `_secret_interaction`, `_secret_apply`, `_secret_finish`, `_secret_abort`.
