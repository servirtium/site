  - core_tests/test_vcr_crlf_body.ae
  - core_tests/test_vcr_bom_crlf.ae
  - core_tests/test_vcr_gzip_normalize.ae
  - core_tests/test_vcr_content_encoding_kept.ae
  - core_tests/test_vcr_head_content_length.ae
  - core_tests/test_vcr_no_invented_content_type.ae
  - core_tests/test_vcr_empty_body_framing.ae
