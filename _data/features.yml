- slug: stable-order
  title: Stable order
  group: Values and bodies
  summary: Opt-in sorting of JSON keys, chosen JSON arrays and response headers at
    write time, so a service that varies its order still re-records byte-identically.
  body: |
    A service that answers in a different order every run (a Go map or Java set behind a JSON object, a header order that shifts, a list ordered by a random id) makes every re-record differ, so drift detection fails and the only cure was throwing content away. **Stable order** sorts what is written, leaving everything else byte-exact. Each rule is **off by default** and registered explicitly; all of them apply on the record side, and playback serves the tape as written.

    | Rule | Writes |
    |---|---|
    | `sort_json_keys` | JSON response bodies' object keys sorted at every depth (order has no meaning in JSON, so this is safe) |
    | `sort_json_array(path, by)` | the arrays `path` selects, sorted by member `by` (names, JSON pointers, or several comma-separated) |
    | `sort_json_array_at(request_regex, path, by)` | the same, only for requests whose path (query included) matches the regex |
    | `sort_response_headers` | response header lines by name, case-insensitive (a repeated header's lines keep their order) |
    | `sort_header_value(name)` | that header's comma-separated items sorted (`Allow: DELETE, GET, POST`) |

    **Arrays are per-array on purpose**: array order is often the meaning (a ranked result), so there is no global switch, and sorting **changes the recorded response**: replay serves the sorted order, so a test must not assert the order it sorted away. `path` is a JSON pointer (`""` the root, `/items/*/tags`, `*` any one segment) or a bare member name.

    **Sorted JSON is only written pretty-printed.** Any JSON sort rule needs `pretty_json` on; otherwise the commit is refused and nothing is written ("sort_json_keys needs pretty_json: sorted JSON is only written pretty-printed (turn pretty_json on)"). A compact body that was silently reordered would look byte-faithful and not be.

    ```python
    import servirtium

    with servirtium.record("tapes/tags.md", upstream) \
            .pretty_json(2).sort_json_keys().sort_json_array("/alpha/x", "n") \
            .sort_response_headers().sort_header_value("Allow").port(0).start() as rec:
        get_tags(rec.base_url)
        rec.commit()
    ```

    I ran this on the release macOS arm64 library: `{"zeta":1,"alpha":{"y":2,"x":[{"n":"b"},{"n":"a"}]}}` came out as pretty JSON with `alpha` first, `x` sorted `a`, `b`, and the headers as `Accept-Ranges`, `Allow: DELETE, GET, POST`, `Content-Length`, ... in name order. Without `.pretty_json(2)` the commit raised the refusal above and no tape existed.

    **Wrapping.** TODO.md still says the bindings do not wrap these; that is out of date. Every binding I checked wraps all five (Python, .NET, Java, Go, Rust, Ruby, JavaScript and the rest; Kotlin, Scala and Groovy inherit Java). The pre-recorded recorder exposes them as `servirtium.sort_json_keys()` and friends.

    C ABI: `aether_vcr_embed_set_sort_json_keys` / `_get_sort_json_keys`, `_sort_json_array`, `_sort_json_array_at`, `_set_sort_response_headers` / `_get_sort_response_headers`, `_sort_header_value`, `_clear_stable_order`.
  docs:
  - AGENTS.md
  - docs/pretty-json.md
  - TODO.md
  tests:
  - core_tests/test_vcr_stable_order.ae
  - python/test/test_record.py
  - dotnet/Servirtium.Vcr.Tests/RecordMutationTests.cs
  bindings: 'every binding wraps the C ABI calls (checked by grep of each binding''s
    source; Kotlin, Scala, Groovy via Java). TODO.md says otherwise: stale'
- slug: pretty-json-xml
  title: Pretty JSON and XML
  group: Values and bodies
  summary: Readable, indented JSON and XML bodies on the tape, and canonical-form
    matching of JSON and XML requests on playback.
  body: |
    Minified bodies make tapes unreadable and make every diff one long line. `pretty_json(indent)` and `pretty_xml(indent)` are single opt-in settings that do two jobs: **record** indented bodies into the tape, and **match** requests on playback by canonical form. Enable the same setting on both the recorder and the player. Both are off by default; indent is 1-16 spaces (higher clamps to 16, 0 turns it off).

    **Recording.** Both request and response bodies are indented when their Content-Type is JSON (`application/json`, `text/json`, `*+json`) or XML (`application/xml`, `text/xml`, `*+xml`, SOAP included). Formatting runs after redactions, secret callbacks and volatile rules, so rules still see the original bytes; recorded `Content-Length` follows the rewritten body. The upstream and the client still see the original bytes. Invalid JSON or XML, and binary bodies, stay byte-exact. The JSON printer keeps key order, duplicate members, array order, string escapes and number spellings (`1.0`, big integers, exponents).

    **Playback.** Responses are served exactly as written. A request body that differs byte for byte gets a second chance at **canonical** equality: JSON ignores whitespace and object-member order (array order matters; `1`, `1.0` and `10e-1` are equal; strings and keys are exact); XML ignores attribute order, indentation, `<x/>` versus `<x></x>`, and CDATA versus escaped text (element order matters). A body that does not parse falls back to byte-exact, so enabling it never loosens non-JSON matching. Mismatch diagnostics show the canonical forms.

    Use `pretty_json` / `pretty_xml` on the playback builder to turn this canonical matching on; there is no separate body-matching switch.

    ```python
    import servirtium

    with servirtium.record("tapes/soap.md", upstream).pretty_xml(2).port(0).start() as rec:
        call_soap(rec.base_url)
        rec.commit()

    with servirtium.playback("tapes/soap.md").pretty_xml(2).port(0).start() as vcr:
        call_soap(vcr.base_url)   # a compact or differently indented request still matches
    ```

    I ran this on the release macOS arm64 library: `<a><b x='1'>t</b><c/></a>` was written as indented XML (`<c></c>`), and a request sent as `<req>\n  <id>1</id>\n</req>` matched a tape recorded from `<req><id>1</id></req>`.

    C ABI: `aether_vcr_embed_set_pretty_json` / `_get_pretty_json`, `aether_vcr_embed_set_pretty_xml` / `_get_pretty_xml`.
  docs:
  - docs/pretty-json.md
  - docs/pretty-xml.md
  tests:
  - core_tests/test_vcr_pretty_json.ae
  - core_tests/test_vcr_pretty_xml.ae
  - core_tests/test_vcr_json_matrix.ae
  - core_tests/test_vcr_xml_matrix.ae
  - core_tests/test_vcr_format_options.ae
  - python/test/test_record.py
